<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>النتائج</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
html{width:100%;min-height:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{min-height:100vh;background:#080b18;color:#fff;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
button,.card,.subscription,.result{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
.container{width:100%;max-width:500px;margin:auto;padding:17px}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#171d34,#101528);border:1px solid #ffffff0d;border-radius:23px;padding:20px;box-shadow:0 12px 30px #00000030;margin-bottom:15px}
h1{text-align:center;margin:5px 0 25px;font-size:28px;color:#fff}
input{width:100%;padding:14px;border:1px solid #ffffff18;border-radius:16px;background:#11172a;color:#fff;font-size:16px;text-align:center;outline:none}
input:focus{border-color:#6c52ff80;box-shadow:0 0 0 3px #6c52ff18}
button{width:100%;padding:14px;border:0;border-radius:17px;background:linear-gradient(135deg,#6745ff,#a05cff);color:#fff;font-size:16px;font-weight:bold;margin-top:12px;cursor:pointer;box-shadow:0 10px 25px #00000030;transition:.2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed;filter:brightness(.65);transform:none}
.hidden{display:none}
.error{text-align:center;color:#ff718b;margin-top:12px;font-size:12px}
.loading{text-align:center;margin:15px;color:#a99cff;font-size:12px}
.success{text-align:center;color:#20d6a1;margin-top:12px;font-size:12px}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.refresh{background:linear-gradient(135deg,#1d2948,#26365d);border:1px solid #ffffff20}
.refresh:active{background:linear-gradient(135deg,#142038,#1d2b4a)}
.subscription{position:relative;overflow:hidden;padding:17px;background:linear-gradient(110deg,#21184a,#161c38 55%,#103e42);border:1px solid #ffffff12;border-radius:20px;margin-top:10px;cursor:pointer;box-shadow:0 10px 25px #00000025}
.subscription:before{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:#6c52ff;filter:blur(35px);opacity:.2;top:-25px;right:-20px}
.subscription b{display:block;font-size:17px;margin-bottom:5px;position:relative}
.subscription span{display:block;position:relative}
.result{position:relative;overflow:hidden;padding:18px;border-radius:20px;background:linear-gradient(145deg,#171d34,#101528);border:1px solid #ffffff0d;margin-top:12px;box-shadow:0 10px 25px #00000025}
.result span{display:block;color:#788199;font-size:14px;margin-bottom:7px}
.result strong{font-size:21px;color:#fff}
.back{background:linear-gradient(135deg,#475569,#64748b)}
@media(min-width:700px){
.container{max-width:700px;padding:30px}
.card{padding:27px;border-radius:27px}
h1{font-size:32px}
input{padding:16px;font-size:17px}
button{padding:16px;font-size:17px}
.subscription{padding:20px}
.result{padding:22px}
}
@media(min-width:1100px){
.container{max-width:850px;padding:35px}
.card{padding:32px}
}
</style>
</head>
<body>
<div class="container">
<div id="login" class="card">
<h1>النتائج</h1>
<input id="code" inputmode="numeric" placeholder="أدخل كود الطالب">
<div class="actions">
<button id="loginBtn" onclick="login()">دخول الطالب</button>
<button id="refreshBtn" class="refresh" onclick="refreshSubscriptions()">🔄 تحديث البيانات</button>
</div>
<div id="error" class="error"></div>
</div>
<div id="subscriptions" class="hidden">
<div class="card">
<h1>الاشتراكات</h1>
<div class="actions">
<button id="refreshSubscriptionsBtn" class="refresh" onclick="refreshSubscriptions()">🔄 تحديث البيانات</button>
</div>
<div id="refreshStatus"></div>
<div id="list"></div>
</div>
</div>
<div id="results" class="hidden">
<div class="card">
<h1>النتائج</h1>
<div class="actions">
<button id="refreshResultsBtn" class="refresh" onclick="refreshResults()">🔄 تحديث البيانات</button>
</div>
<div id="resultsStatus"></div>
<div id="resultData"></div>
<button class="back" onclick="back()">العودة للاشتراكات</button>
</div>
</div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbw7IEr3qOBbMf2mSn_U1pasRtKpF6AIcid6errcU2pCv2APSxtj3iTLzWzkK-G-N-DnkQ/exec';
let code='';
let currentSubscription=null;
function normalize(v){return String(v||'').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).trim()}
async function login(){
const btn=document.getElementById('loginBtn');
const error=document.getElementById('error');
code=normalize(document.getElementById('code').value);
error.textContent='';
if(!code){error.textContent='أدخل كود الطالب';return}
const cached=getSubscriptionsCache(code);
if(cached){
renderSubscriptions(cached);
document.getElementById('login').classList.add('hidden');
document.getElementById('subscriptions').classList.remove('hidden');
}
btn.disabled=true;
btn.textContent='جاري التحميل...';
try{
const r=await fetch(API+'?action=subscriptions&code='+encodeURIComponent(code)+'&_cache='+Date.now(),{cache:'no-store'});
const data=await r.json();
if(!data.success){
if(!cached)error.textContent=data.error||'حدث خطأ';
return;
}
if(!data.subscriptions||!data.subscriptions.length){
if(!cached)error.textContent='لا توجد اشتراكات';
return;
}
saveSubscriptionsCache(code,data.subscriptions);
renderSubscriptions(data.subscriptions);
document.getElementById('login').classList.add('hidden');
document.getElementById('subscriptions').classList.remove('hidden');
}catch(e){
if(!cached)error.textContent='تعذر الاتصال بالخادم';
}finally{
btn.disabled=false;
btn.textContent='دخول الطالب';
}
}
async function refreshSubscriptions(){
const inputCode=normalize(document.getElementById('code').value);
if(inputCode)code=inputCode;
if(!code){
document.getElementById('error').textContent='أدخل كود الطالب';
return;
}
const cached=getSubscriptionsCache(code);
if(cached){
renderSubscriptions(cached);
document.getElementById('login').classList.add('hidden');
document.getElementById('subscriptions').classList.remove('hidden');
}
const btn1=document.getElementById('refreshBtn');
const btn2=document.getElementById('refreshSubscriptionsBtn');
btn1.disabled=true;
btn2.disabled=true;
btn1.textContent='جاري التحديث...';
btn2.textContent='جاري التحديث...';
document.getElementById('refreshStatus').innerHTML='<div class="success">جاري تحديث البيانات...</div>';
try{
const r=await fetch(API+'?action=subscriptions&code='+encodeURIComponent(code)+'&_refresh='+Date.now(),{cache:'no-store'});
const data=await r.json();
if(!data.success)throw new Error(data.error||'حدث خطأ');
if(!data.subscriptions||!data.subscriptions.length)throw new Error('لا توجد بيانات جديدة');
saveSubscriptionsCache(code,data.subscriptions);
renderSubscriptions(data.subscriptions);
document.getElementById('login').classList.add('hidden');
document.getElementById('subscriptions').classList.remove('hidden');
document.getElementById('refreshStatus').innerHTML='<div class="success">تم تحديث البيانات بنجاح.</div>';
}catch(e){
document.getElementById('refreshStatus').innerHTML='<div class="error">تعذر التحديث، تم الاحتفاظ بالبيانات القديمة.</div>';
}finally{
btn1.disabled=false;
btn2.disabled=false;
btn1.textContent='🔄 تحديث البيانات';
btn2.textContent='🔄 تحديث البيانات';
}
}
function renderSubscriptions(data){
const list=document.getElementById('list');
list.innerHTML='';
data.forEach(s=>{
const div=document.createElement('div');
div.className='subscription';
div.innerHTML='<b>الاشتراك '+escapeHtml(s.subscription)+'</b><span>المعلم: '+escapeHtml(s.teacher)+'</span><span>المادة: '+escapeHtml(s.subject)+'</span>';
div.onclick=()=>getResults(s);
list.appendChild(div);
});
}
async function getResults(s){
currentSubscription=s;
document.getElementById('subscriptions').classList.add('hidden');
document.getElementById('results').classList.remove('hidden');
const cached=getResultsCache(code,s);
if(cached){
renderResults(cached);
}else{
document.getElementById('resultData').innerHTML='<div class="loading">جاري تحميل النتائج...</div>';
}
document.getElementById('refreshResultsBtn').disabled=true;
document.getElementById('refreshResultsBtn').textContent='جاري التحميل...';
try{
const url=API+'?action=results&code='+encodeURIComponent(code)+'&subscription='+encodeURIComponent(s.subscription)+'&column='+encodeURIComponent(s.column)+'&teacher='+encodeURIComponent(s.teacher)+'&subject='+encodeURIComponent(s.subject)+'&_cache='+Date.now();
const r=await fetch(url,{cache:'no-store'});
const data=await r.json();
if(!data.success){
if(!cached)document.getElementById('resultData').innerHTML='<div class="error">'+escapeHtml(data.error||'حدث خطأ')+'</div>';
return;
}
saveResultsCache(code,s,data.results);
renderResults(data.results);
}catch(e){
if(!cached)document.getElementById('resultData').innerHTML='<div class="error">تعذر الاتصال بالخادم</div>';
}finally{
document.getElementById('refreshResultsBtn').disabled=false;
document.getElementById('refreshResultsBtn').textContent='🔄 تحديث البيانات';
}
}
async function refreshResults(){
if(!code||!currentSubscription)return;
const s=currentSubscription;
const cached=getResultsCache(code,s);
if(cached)renderResults(cached);
const btn=document.getElementById('refreshResultsBtn');
btn.disabled=true;
btn.textContent='جاري التحديث...';
document.getElementById('resultsStatus').innerHTML='<div class="success">جاري تحديث البيانات...</div>';
try{
const url=API+'?action=results&code='+encodeURIComponent(code)+'&subscription='+encodeURIComponent(s.subscription)+'&column='+encodeURIComponent(s.column)+'&teacher='+encodeURIComponent(s.teacher)+'&subject='+encodeURIComponent(s.subject)+'&_refresh='+Date.now();
const r=await fetch(url,{cache:'no-store'});
const data=await r.json();
if(!data.success)throw new Error(data.error||'حدث خطأ');
if(!data.results)throw new Error('لا توجد بيانات جديدة');
saveResultsCache(code,s,data.results);
renderResults(data.results);
document.getElementById('resultsStatus').innerHTML='<div class="success">تم تحديث البيانات بنجاح.</div>';
}catch(e){
document.getElementById('resultsStatus').innerHTML='<div class="error">تعذر التحديث، تم الاحتفاظ بالبيانات القديمة.</div>';
}finally{
btn.disabled=false;
btn.textContent='🔄 تحديث البيانات';
}
}
function renderResults(results){
document.getElementById('resultData').innerHTML='<div class="result"><span>نتائج الواجب</span><strong>'+escapeHtml(results.homework)+'</strong></div><div class="result"><span>نتائج الاختبار</span><strong>'+escapeHtml(results.exam)+'</strong></div><div class="result"><span>تقييم المعلم</span><strong>'+escapeHtml(results.teacherRating)+'</strong></div>';
}
function saveSubscriptionsCache(code,data){
try{
localStorage.setItem('results_subscriptions_'+code,JSON.stringify({data:data,savedAt:Date.now()}));
}catch(e){}
}
function getSubscriptionsCache(code){
try{
const cached=localStorage.getItem('results_subscriptions_'+code);
if(!cached)return null;
const parsed=JSON.parse(cached);
return parsed.data||null;
}catch(e){
return null;
}
}
function getResultsKey(code,s){
return 'results_data_'+code+'_'+String(s.subscription)+'_'+String(s.column);
}
function saveResultsCache(code,s,data){
try{
localStorage.setItem(getResultsKey(code,s),JSON.stringify({data:data,savedAt:Date.now()}));
}catch(e){}
}
function getResultsCache(code,s){
try{
const cached=localStorage.getItem(getResultsKey(code,s));
if(!cached)return null;
const parsed=JSON.parse(cached);
return parsed.data||null;
}catch(e){
return null;
}
}
function back(){
document.getElementById('results').classList.add('hidden');
document.getElementById('subscriptions').classList.remove('hidden');
}
function escapeHtml(v){
return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});
document.addEventListener('selectstart',e=>{if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')e.preventDefault()},{passive:false});
document.addEventListener('dragstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('copy',e=>e.preventDefault(),{passive:false});
document.addEventListener('cut',e=>e.preventDefault(),{passive:false});
document.addEventListener('beforecopy',e=>e.preventDefault(),{passive:false});
document.addEventListener('beforecut',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
</script>
<script src="auth.js"></script>
</body>
</html>
