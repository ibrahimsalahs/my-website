<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>المواعيد</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}
html,body{min-height:100vh;background:#080b18;color:#fff}
body{overflow-x:hidden}
.container{width:100%;max-width:none;margin:auto;padding:10px}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#171d34,#101528);border:1px solid #ffffff0d;border-radius:16px;padding:12px;box-shadow:0 8px 20px #00000030;width:100%}
.login{max-width:100%;margin:auto}
h1,h2{text-align:center;margin:0 0 10px;color:#fff;font-size:16px}
input{width:100%;padding:9px;border:1px solid #ffffff18;border-radius:10px;background:#11172a;color:#fff;font-size:12px;margin-bottom:7px;outline:none}
input:focus{border-color:#6c52ff80;box-shadow:0 0 0 2px #6c52ff18}
button{width:100%;padding:9px;border:0;border-radius:11px;background:linear-gradient(135deg,#6745ff,#a05cff);color:#fff;font-size:12px;font-weight:bold;cursor:pointer;box-shadow:0 6px 15px #00000030}
button:active{transform:scale(.98)}
button:disabled{opacity:.6;cursor:not-allowed}
.message{text-align:center;padding:9px;color:#788199;font-size:11px}
.error{color:#ff718b;text-align:center;padding:7px;font-size:11px}
.hidden{display:none}
.tableWrap{width:100%;overflow-x:auto;border-radius:12px}
table{width:100%;min-width:0;border-collapse:separate;border-spacing:0;text-align:center;overflow:hidden;border-radius:12px;background:#11172a;font-size:9px;table-layout:fixed}
th,td{border:1px solid #ffffff0d;padding:6px 3px;vertical-align:middle;word-break:break-word}
th{background:linear-gradient(135deg,#6745ff,#4e35c8);color:#fff;white-space:nowrap;font-size:9px}
td{color:#d9deeb;background:#151b30}
td.teacher,td.subject{font-weight:bold;white-space:normal;color:#fff}
.dayItem{display:block;margin:2px 0;padding:4px 2px;background:#171d34;border:1px solid #ffffff0d;border-radius:6px;white-space:normal;color:#d9deeb;font-size:8px}
.totalRow{font-weight:bold;background:#21184a!important;color:#fff}
@media(min-width:700px){
.container{width:100%;max-width:none;padding:10px}
.card{padding:14px;border-radius:17px}
h1{font-size:18px}
h2{font-size:15px}
input{padding:9px;font-size:12px}
button{padding:9px;font-size:12px}
th,td{padding:6px 4px}
table{font-size:9px}
}
@media(min-width:1100px){
.container{width:100%;max-width:none;padding:10px}
.card{padding:15px}
h1{font-size:19px}
h2{font-size:16px}
th,td{padding:7px 4px}
table{font-size:9px}
.dayItem{font-size:8px}
      }</style>
</head>
<body>

<div id="loginScreen" class="container">
<div class="card login">
<h1>دخول الطالب</h1>
<input id="code" type="text" inputmode="numeric" placeholder="أدخل كود الطالب">
<button id="loginBtn">إرسال</button>
<div id="message"></div>
</div>
</div>

<div id="scheduleScreen" class="container hidden">
<div class="card">
<h2>جدول المواعيد</h2>
<div id="content"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbwgOA7tA6rX9TtFvACzycl8PRUAwbCt5qdMEzKKbNoTGzR2kPczh4xAaacPjKN2NHgO/exec";
const days=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];
const loginScreen=document.getElementById("loginScreen");
const scheduleScreen=document.getElementById("scheduleScreen");
const codeInput=document.getElementById("code");
const loginBtn=document.getElementById("loginBtn");
const message=document.getElementById("message");
const content=document.getElementById("content");

loginBtn.addEventListener("click",loadSchedule);
codeInput.addEventListener("keydown",e=>{
if(e.key==="Enter")loadSchedule();
});

async function loadSchedule(){
const code=codeInput.value.trim();
if(!code){
message.innerHTML='<div class="error">أدخل كود الطالب</div>';
return;
}
loginBtn.disabled=true;
message.innerHTML='<div class="message">جاري تحميل المواعيد...</div>';
try{
const response=await fetch(API+"?code="+encodeURIComponent(code));
if(!response.ok)throw new Error("فشل الاتصال بالخادم");
const data=await response.json();
if(data.error)throw new Error(data.error);
if(!data.rows||!data.rows.length)throw new Error("لا توجد مواعيد للطالب");
renderSchedule(data);
loginScreen.classList.add("hidden");
scheduleScreen.classList.remove("hidden");
}catch(e){
message.innerHTML='<div class="error">'+escapeHtml(e.message)+'</div>';
}finally{
loginBtn.disabled=false;
}
}

function renderSchedule(data){
let html='<div class="tableWrap"><table><thead><tr>';
html+="<th>اسم المعلم</th><th>المادة</th>";
days.forEach(day=>html+="<th>"+day+"</th>");
html+="<th>المجموع </th></tr></thead><tbody>";

data.rows.forEach(row=>{
html+="<tr>";
html+='<td class="teacher">'+escapeHtml(row.teacher)+'</td>';
html+='<td class="subject">'+escapeHtml(row.subject)+'</td>';
days.forEach(day=>{
html+="<td>";
if(row.schedule[day]&&row.schedule[day].length){
row.schedule[day].forEach(time=>{
html+='<span class="dayItem">'+escapeHtml(time)+'</span>';
});
}
html+="</td>";
});
html+="<td>"+row.total+"</td>";
html+="</tr>";
});

html+='<tr class="totalRow">';
html+="<td>"+data.totals.teachers+"</td>";
html+="<td>"+data.totals.subjects+"</td>";
days.forEach(day=>html+="<td>"+data.totals[day]+"</td>");
html+="<td>"+data.totals.total+"</td>";
html+="</tr>";

html+="</tbody></table></div>";
content.innerHTML=html;
}

function escapeHtml(value){
return String(value).replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char]));
}
</script>
  <script src="auth.js"></script>
</body>
</html>
