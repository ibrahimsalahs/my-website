<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>أكاديمية البيان</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #eef1f5;
      height: 100vh;
      overflow: hidden;
    }

    /* =========================
       APP
       ========================= */

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 700px;
      margin: auto;
      background: #ffffff;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      height: 65px;
      background: #0b1220;
      color: white;

      display: flex;
      align-items: center;

      padding: 0 18px;

      box-shadow: 0 2px 8px rgba(0,0,0,.15);

      flex-shrink: 0;
    }

    .logo {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      background: #ffffff;
      color: #0b1220;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
      font-size: 18px;

      margin-left: 12px;
    }

    .header-info {
      display: flex;
      flex-direction: column;
    }

    .header-title {
      font-size: 17px;
      font-weight: bold;
    }

    .header-status {
      font-size: 12px;
      opacity: .7;
      margin-top: 3px;
    }

    /* =========================
       CHAT
       ========================= */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding: 20px 15px;

      background:
        linear-gradient(
          rgba(238,241,245,.94),
          rgba(238,241,245,.94)
        );
    }

    .message {
      max-width: 85%;

      margin-bottom: 14px;

      animation: appear .2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bot {
      margin-left: auto;
      margin-right: 0;
    }

    .user {
      margin-right: auto;
      margin-left: 0;
    }

    .bubble {
      padding: 13px 15px;

      border-radius: 15px;

      font-size: 15px;

      line-height: 1.7;

      word-break: break-word;
    }

    .bot .bubble {
      background: white;
      color: #172033;

      border: 1px solid #e2e6eb;

      border-top-right-radius: 4px;
    }

    .user .bubble {
      background: #0b1220;
      color: white;

      border-top-left-radius: 4px;
    }

    /* =========================
       MENU
       ========================= */

    .menu-title {
      font-size: 17px;
      font-weight: bold;

      margin-bottom: 14px;
    }

    .menu-subtitle {
      color: #697386;

      font-size: 13px;

      margin-bottom: 18px;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .menu-button {
      width: 100%;

      border: 1px solid #dce1e8;

      background: #ffffff;

      color: #182235;

      border-radius: 10px;

      padding: 12px 14px;

      font-size: 14px;

      cursor: pointer;

      text-align: right;

      transition: .15s;
    }

    .menu-button:hover {
      background: #f3f5f8;
    }

    .menu-button:active {
      transform: scale(.98);
    }

    .button-title {
      font-weight: bold;
      display: block;
    }

    .button-subtitle {
      display: block;

      color: #7a8494;

      font-size: 12px;

      margin-top: 4px;
    }

    /* =========================
       START SCREEN
       ========================= */

    .start-box {
      text-align: center;

      padding: 30px 10px;
    }

    .start-icon {
      width: 75px;
      height: 75px;

      margin: 0 auto 18px;

      border-radius: 50%;

      background: #0b1220;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
    }

    .start-title {
      font-size: 22px;
      font-weight: bold;

      margin-bottom: 8px;
    }

    .start-description {
      color: #687385;

      font-size: 14px;

      line-height: 1.8;

      margin-bottom: 25px;
    }

    /* =========================
       ID BOX
       ========================= */

    .id-box {
      padding: 12px;

      border-top: 1px solid #e5e8ed;

      background: white;

      flex-shrink: 0;
    }

    .id-row {
      display: flex;
      gap: 8px;
    }

    .id-input {
      flex: 1;

      border: 1px solid #d8dde5;

      border-radius: 10px;

      padding: 12px;

      font-size: 14px;

      outline: none;

      direction: ltr;

      text-align: left;
    }

    .id-input:focus {
      border-color: #0b1220;
    }

    .start-button {
      border: none;

      background: #0b1220;

      color: white;

      border-radius: 10px;

      padding: 0 18px;

      font-size: 14px;

      cursor: pointer;
    }

    .start-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       LOADING
       ========================= */

    .loading {
      display: inline-flex;

      align-items: center;

      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;

      background: #687385;

      border-radius: 50%;

      animation: blink 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {

      0%, 80%, 100% {
        opacity: .3;
      }

      40% {
        opacity: 1;
      }

    }

    /* =========================
       ERROR
       ========================= */

    .error {
      background: #fff1f1;

      border: 1px solid #f0caca;

      color: #a52828;

      padding: 12px;

      border-radius: 10px;

      font-size: 13px;

      margin-top: 10px;

      direction: rtl;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .app {
        max-width: 100%;
      }

      .header {
        height: 60px;
      }

      .chat {
        padding: 15px 10px;
      }

      .message {
        max-width: 92%;
      }

    }

  </style>
</head>


<body>


<div class="app">


  <!-- =========================
       HEADER
       ========================= -->

  <div class="header">

    <div class="logo">
      ب
    </div>

    <div class="header-info">

      <div class="header-title">
        أكاديمية البيان
      </div>

      <div class="header-status">
        منصة الطالب
      </div>

    </div>

  </div>


  <!-- =========================
       CHAT
       ========================= -->

  <div
    id="chat"
    class="chat"
  >

    <div class="start-box">

      <div class="start-icon">
        ب
      </div>

      <div class="start-title">
        أهلاً بك في أكاديمية البيان
      </div>

      <div class="start-description">
        أدخل رقم الطالب ثم اضغط ابدأ
        <br>
        للوصول إلى خدماتك.
      </div>

    </div>

  </div>


  <!-- =========================
       ID INPUT
       ========================= -->

  <div class="id-box">

    <div class="id-row">

      <input
        id="studentId"
        class="id-input"
        type="text"
        inputmode="numeric"
        placeholder="أدخل ID الطالب"
      >

      <button
        id="startButton"
        class="start-button"
        onclick="startStudent()"
      >
        ابدأ
      </button>

    </div>

  </div>


</div>



<script>


/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = {

  /*
    ضع هنا رابط Web App
    لمشروع Google Apps Script الخاص بالطلاب
  */

  API_URL:
    'https://script.google.com/macros/s/AKfycbw9utjlPZyqeNic1edJmm-e0L86nlnDV1jNF8-37DqxFwt-j8uAyoqNN1BiGRaNeNC3/exec',

  /*
    يجب أن يكون نفس ROUTER_SECRET
    الموجود في Apps Script
  */

  SECRET:
    'CHANGE_THIS_SECRET'

};



/* =========================================================
   GLOBAL
   ========================================================= */

let currentStudentId = '';



/* =========================================================
   START
   ========================================================= */

async function startStudent() {

  const input =
    document.getElementById('studentId');

  const button =
    document.getElementById('startButton');

  const studentId =
    input.value.trim();


  if (!studentId) {

    input.focus();

    return;
  }


  currentStudentId = studentId;

  button.disabled = true;

  input.disabled = true;


  /*
    عرض رسالة المستخدم
  */

  addUserMessage(
    'بدء الدخول إلى المنصة'
  );


  /*
    إرسال MAIN_MENU
  */

  await sendEvent(
    'MAIN_MENU'
  );


  button.disabled = false;

}



/* =========================================================
   SEND EVENT
   ========================================================= */

async function sendEvent(payload) {

  addLoading();


  try {

    const response =
      await fetch(
        CONFIG.API_URL,
        {

          method: 'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body: JSON.stringify({

            secret:
              CONFIG.SECRET,

            channel:
              'web',

            senderId:
              currentStudentId,

            payload:
              payload

          })

        }
      );


    const data =
      await response.json();


    removeLoading();


    console.log(
      'SERVER RESPONSE:',
      data
    );


    if (!data.ok) {

      addError(
        data.error ||
        'حدث خطأ أثناء تنفيذ الطلب'
      );

      return;
    }


    /*
      عرض نتيجة السيرفر
    */

    renderResult(
      data.result
    );


  } catch (error) {

    removeLoading();

    console.error(error);

    addError(
      'تعذر الاتصال بالسيرفر'
    );

  }

}



/* =========================================================
   RENDER RESULT
   ========================================================= */

function renderResult(result) {

  if (!result) {

    addError(
      'السيرفر لم يرجع نتيجة'
    );

    return;
  }


  /*
    رسالة عادية
  */

  if (result.type === 'message') {

    addBotMessage(
      result.text || ''
    );

    return;
  }


  /*
    القائمة
  */

  if (result.type === 'menu') {

    renderMenu(result);

    return;
  }


  /*
    لو نوع غير معروف
  */

  addError(
    'نوع الاستجابة غير معروف: ' +
    result.type
  );

}



/* =========================================================
   RENDER MENU
   ========================================================= */

function renderMenu(menu) {

  const chat =
    document.getElementById('chat');


  const wrapper =
    document.createElement('div');

  wrapper.className =
    'message bot';


  const bubble =
    document.createElement('div');

  bubble.className =
    'bubble';


  if (menu.title) {

    const title =
      document.createElement('div');

    title.className =
      'menu-title';

    title.textContent =
      menu.title;

    bubble.appendChild(
      title
    );

  }


  if (menu.subtitle) {

    const subtitle =
      document.createElement('div');

    subtitle.className =
      'menu-subtitle';

    subtitle.textContent =
      menu.subtitle;

    bubble.appendChild(
      subtitle
    );

  }


  const buttons =
    document.createElement('div');

  buttons.className =
    'menu-buttons';


  (menu.buttons || []).forEach(
    buttonData => {

      const button =
        document.createElement('button');

      button.className =
        'menu-button';


      const title =
        document.createElement('span');

      title.className =
        'button-title';

      title.textContent =
        buttonData.title || 'فتح';


      button.appendChild(
        title
      );


      if (buttonData.subtitle) {

        const subtitle =
          document.createElement('span');

        subtitle.className =
          'button-subtitle';

        subtitle.textContent =
          buttonData.subtitle;

        button.appendChild(
          subtitle
        );

      }


      button.onclick = () => {

        /*
          عرض اختيار الطالب
        */

        addUserMessage(
          buttonData.title
        );


        /*
          إرسال payload نفسه
        */

        sendEvent(
          buttonData.payload
        );

      };


      buttons.appendChild(
        button
      );

    }
  );


  bubble.appendChild(
    buttons
  );


  wrapper.appendChild(
    bubble
  );


  chat.appendChild(
    wrapper
  );


  scrollBottom();

}



/* =========================================================
   USER MESSAGE
   ========================================================= */

function addUserMessage(text) {

  const chat =
    document.getElementById('chat');


  const wrapper =
    document.createElement('div');

  wrapper.className =
    'message user';


  const bubble =
    document.createElement('div');

  bubble.className =
    'bubble';

  bubble.textContent =
    text;


  wrapper.appendChild(
    bubble
  );


  chat.appendChild(
    wrapper
  );


  scrollBottom();

}



/* =========================================================
   BOT MESSAGE
   ========================================================= */

function addBotMessage(text) {

  const chat =
    document.getElementById('chat');


  const wrapper =
    document.createElement('div');

  wrapper.className =
    'message bot';


  const bubble =
    document.createElement('div');

  bubble.className =
    'bubble';

  bubble.textContent =
    text;


  wrapper.appendChild(
    bubble
  );


  chat.appendChild(
    wrapper
  );


  scrollBottom();

}



/* =========================================================
   LOADING
   ========================================================= */

function addLoading() {

  const chat =
    document.getElementById('chat');


  removeLoading();


  const wrapper =
    document.createElement('div');

  wrapper.id =
    'loadingMessage';

  wrapper.className =
    'message bot';


  const bubble =
    document.createElement('div');

  bubble.className =
    'bubble';


  const loading =
    document.createElement('div');

  loading.className =
    'loading';


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const dot =
      document.createElement('span');

    dot.className =
      'dot';

    loading.appendChild(
      dot
    );

  }


  bubble.appendChild(
    loading
  );

  wrapper.appendChild(
    bubble
  );

  chat.appendChild(
    wrapper
  );


  scrollBottom();

}



/* =========================================================
   REMOVE LOADING
   ========================================================= */

function removeLoading() {

  const loading =
    document.getElementById(
      'loadingMessage'
    );


  if (loading) {

    loading.remove();

  }

}



/* =========================================================
   ERROR
   ========================================================= */

function addError(text) {

  const chat =
    document.getElementById('chat');


  const wrapper =
    document.createElement('div');

  wrapper.className =
    'message bot';


  const box =
    document.createElement('div');

  box.className =
    'error';

  box.textContent =
    text;


  wrapper.appendChild(
    box
  );


  chat.appendChild(
    wrapper
  );


  scrollBottom();

}



/* =========================================================
   SCROLL
   ========================================================= */

function scrollBottom() {

  const chat =
    document.getElementById('chat');


  setTimeout(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    },
    50
  );

}


</script>

</body>
</html>
