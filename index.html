<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>أكاديمية البيان</title>


<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  background:#0b1220;

  color:#fff;

  font-family:
    Tahoma,
    Arial,
    sans-serif;

}


.container{

  width:100%;

  max-width:700px;

  margin:auto;

  padding:20px;

}


.header{

  text-align:center;

  margin-bottom:20px;

}


.header h1{

  margin:0;

  font-size:25px;

}


.header p{

  color:#9ca3af;

  margin-top:8px;

}


.card{

  background:#111827;

  border:1px solid #1f2937;

  border-radius:16px;

  padding:18px;

  margin-bottom:15px;

}


label{

  display:block;

  margin-bottom:8px;

  color:#d1d5db;

}


input{

  width:100%;

  padding:14px;

  border-radius:10px;

  border:1px solid #374151;

  background:#0b1220;

  color:white;

  font-size:16px;

  direction:ltr;

  text-align:left;

  outline:none;

}


input:focus{

  border-color:#3b82f6;

}


.main-button{

  width:100%;

  padding:14px;

  margin-top:12px;

  border:0;

  border-radius:10px;

  background:#2563eb;

  color:white;

  font-size:16px;

  cursor:pointer;

}


.main-button:disabled{

  opacity:.5;

}


.status{

  display:none;

  margin-top:12px;

  padding:12px;

  border-radius:10px;

  background:#0f172a;

  color:#9ca3af;

}


.chat{

  margin-top:15px;

}


.message{

  background:#111827;

  border:1px solid #1f2937;

  border-radius:16px;

  padding:16px;

  margin-bottom:14px;

}


.message-title{

  font-size:19px;

  font-weight:bold;

  margin-bottom:6px;

}


.message-subtitle{

  color:#9ca3af;

  font-size:14px;

  margin-bottom:15px;

}


.menu{

  display:flex;

  flex-direction:column;

  gap:10px;

}


.menu-button{

  width:100%;

  padding:15px;

  background:#172033;

  color:white;

  border:1px solid #293548;

  border-radius:12px;

  cursor:pointer;

  text-align:right;

}


.menu-button:hover{

  background:#1e293b;

}


.menu-title{

  display:block;

  font-size:16px;

  font-weight:bold;

}


.menu-subtitle{

  display:block;

  color:#9ca3af;

  font-size:13px;

  margin-top:5px;

}


.back{

  width:100%;

  margin-top:12px;

  padding:13px;

  background:#374151;

  border:0;

  border-radius:10px;

  color:white;

  cursor:pointer;

}


.data{

  display:flex;

  flex-direction:column;

  gap:8px;

}


.data-item{

  background:#0b1220;

  border-radius:10px;

  padding:12px;

}


.data-key{

  color:#9ca3af;

  font-size:13px;

  margin-bottom:5px;

}


.data-value{

  color:#fff;

  word-break:break-word;

}


.array-item{

  background:#0b1220;

  border:1px solid #1f2937;

  border-radius:12px;

  padding:12px;

  margin-bottom:8px;

}


.error{

  background:#3f1717;

  border-color:#7f1d1d;

  color:#fecaca;

}


.loading{

  text-align:center;

  padding:20px;

  color:#9ca3af;

}


pre{

  direction:ltr;

  text-align:left;

  white-space:pre-wrap;

  word-break:break-word;

  color:#d1d5db;

}

</style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>أكاديمية البيان</h1>

    <p>واجهة اختبار مشروع الطلاب</p>

  </div>


  <div class="card">

    <label>

      ID المستخدم

    </label>


    <input
      id="senderId"
      type="text"
      placeholder="اكتب ID المستخدم"
      autocomplete="off"
    >


    <button
      id="sendButton"
      class="main-button"
      onclick="start()"
    >

      إرسال

    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <div
    id="chat"
    class="chat"
  ></div>


</div>



<script>


/* =====================================================
   إعدادات
===================================================== */


const API_URL =
  'https://script.google.com/macros/s/AKfycbw9utjlPZyqeNic1edJmm-e0L86nlnDV1jNF8-37DqxFwt-j8uAyoqNN1BiGRaNeNC3/exec';


const SECRET =
  'CHANGE_THIS_SECRET';



/* =====================================================
   متغيرات
===================================================== */


let currentSenderId = '';

let requestNumber = 0;



/* =====================================================
   بدء
===================================================== */


function start(){

  const id =
    document
      .getElementById('senderId')
      .value
      .trim();


  if(!id){

    setStatus(
      'من فضلك أدخل ID المستخدم',
      true
    );

    return;

  }


  currentSenderId =
    id;


  document
    .getElementById('chat')
    .innerHTML = '';


  request(
    id,
    ''
  );

}



/* =====================================================
   الطلب
===================================================== */


function request(
  senderId,
  payload
){

  setLoading(true);


  const callback =
    'response_' +
    (++requestNumber);


  const params =
    new URLSearchParams();


  params.set(
    'senderId',
    senderId
  );


  params.set(
    'secret',
    SECRET
  );


  params.set(
    'callback',
    callback
  );


  if(payload){

    params.set(
      'payload',
      payload
    );

  }


  const url =
    API_URL +
    '?' +
    params.toString();


  /*
   * JSONP
   *
   * نستخدم script بدل fetch
   * حتى لا تتعطل الصفحة بسبب CORS.
   */


  const script =
    document.createElement('script');


  script.src =
    url;


  script.async =
    true;


  window[callback] =
    function(response){

      try{

        handleResponse(
          response
        );

      }finally{

        delete window[callback];

        script.remove();

        setLoading(false);

      }

    };


  script.onerror =
    function(){

      delete window[callback];

      script.remove();

      setLoading(false);

      showError(
        'فشل الاتصال بمشروع Google Apps Script'
      );

    };


  document
    .body
    .appendChild(script);

}



/* =====================================================
   استقبال الرد
===================================================== */


function handleResponse(response){

  console.log(
    'SERVER:',
    response
  );


  if(!response){

    showError(
      'لم يصل رد من السيرفر'
    );

    return;

  }


  if(!response.success){

    showError(
      response.error ||
      'حدث خطأ'
    );

    return;

  }


  render(
    response.data
  );


  setStatus(
    'تم استلام الرد',
    false
  );

}



/* =====================================================
   عرض أي رد
===================================================== */


function render(data){

  if(!data){

    showError(
      'الرد فارغ'
    );

    return;

  }


  if(data.type === 'menu'){

    renderMenu(data);

    return;

  }


  renderGeneric(
    data
  );

}



/* =====================================================
   القائمة
===================================================== */


function renderMenu(data){

  const box =
    createMessage(
      data.title ||
      'القائمة الرئيسية'
    );


  if(data.subtitle){

    const subtitle =
      document.createElement('div');

    subtitle.className =
      'message-subtitle';

    subtitle.textContent =
      data.subtitle;

    box.appendChild(
      subtitle
    );

  }


  const menu =
    document.createElement('div');

  menu.className =
    'menu';


  const items =
    Array.isArray(data.items)
      ? data.items
      : [];


  items.forEach(
    function(item){

      const button =
        document.createElement('button');


      button.className =
        'menu-button';


      const title =
        document.createElement('span');

      title.className =
        'menu-title';

      title.textContent =
        item.title || 'اختيار';


      const subtitle =
        document.createElement('span');

      subtitle.className =
        'menu-subtitle';

      subtitle.textContent =
        item.subtitle || '';


      button.appendChild(
        title
      );

      button.appendChild(
        subtitle
      );


      button.onclick =
        function(){

          request(
            currentSenderId,
            item.payload
          );

        };


      menu.appendChild(
        button
      );

    }
  );


  box.appendChild(
    menu
  );


  addToChat(
    box
  );

}



/* =====================================================
   عرض الردود والبيانات
===================================================== */


function renderGeneric(data){

  const box =
    createMessage(
      data.title ||
      'النتيجة'
    );


  if(data.text){

    const text =
      document.createElement('div');

    text.textContent =
      data.text;

    box.appendChild(
      text
    );

  }


  /*
   * data
   */

  if(data.data){

    const dataBox =
      document.createElement('div');

    dataBox.className =
      'data';


    renderValue(
      data.data,
      dataBox
    );


    box.appendChild(
      dataBox
    );

  }


  /*
   * لو الرد نفسه يحتوي بيانات
   * بدون data
   */

  const ignored = [
    'type',
    'title',
    'subtitle',
    'text',
    'data'
  ];


  const extra = {};


  Object.keys(data)
    .forEach(
      function(key){

        if(
          !ignored.includes(key)
        ){

          extra[key] =
            data[key];

        }

      }
    );


  if(
    Object.keys(extra).length
  ){

    const extraBox =
      document.createElement('div');

    extraBox.className =
      'data';


    renderValue(
      extra,
      extraBox
    );


    box.appendChild(
      extraBox
    );

  }


  /*
   * زر الرجوع
   */

  const back =
    document.createElement('button');

  back.className =
    'back';

  back.textContent =
    '⬅ العودة للقائمة الرئيسية';


  back.onclick =
    function(){

      request(
        currentSenderId,
        'MAIN_MENU'
      );

    };


  box.appendChild(
    back
  );


  addToChat(
    box
  );

}



/* =====================================================
   عرض Object / Array / String
===================================================== */


function renderValue(
  value,
  parent
){


  /*
   * Array
   */

  if(Array.isArray(value)){

    value.forEach(
      function(item, index){

        const itemBox =
          document.createElement('div');

        itemBox.className =
          'array-item';


        if(
          typeof item === 'object' &&
          item !== null
        ){

          renderValue(
            item,
            itemBox
          );

        }else{

          itemBox.textContent =
            String(item);

        }


        parent.appendChild(
          itemBox
        );

      }
    );

    return;

  }



  /*
   * Object
   */

  if(
    typeof value === 'object' &&
    value !== null
  ){

    Object.keys(value)
      .forEach(
        function(key){

          const item =
            document.createElement('div');

          item.className =
            'data-item';


          const keyElement =
            document.createElement('div');

          keyElement.className =
            'data-key';

          keyElement.textContent =
            key;


          const valueElement =
            document.createElement('div');

          valueElement.className =
            'data-value';


          if(
            typeof value[key] === 'object' &&
            value[key] !== null
          ){

            renderValue(
              value[key],
              valueElement
            );

          }else{

            valueElement.textContent =
              String(
                value[key] ?? ''
              );

          }


          item.appendChild(
            keyElement
          );

          item.appendChild(
            valueElement
          );


          parent.appendChild(
            item
          );

        }
      );

    return;

  }



  /*
   * String / Number / Boolean
   */

  const item =
    document.createElement('div');

  item.className =
    'data-item';

  item.textContent =
    String(value ?? '');


  parent.appendChild(
    item
  );

}



/* =====================================================
   إنشاء رسالة
===================================================== */


function createMessage(title){

  const box =
    document.createElement('div');

  box.className =
    'message';


  const titleElement =
    document.createElement('div');

  titleElement.className =
    'message-title';

  titleElement.textContent =
    title;


  box.appendChild(
    titleElement
  );


  return box;

}



/* =====================================================
   إضافة للمحادثة
===================================================== */


function addToChat(element){

  const chat =
    document.getElementById(
      'chat'
    );


  chat.appendChild(
    element
  );


  setTimeout(
    function(){

      window.scrollTo({

        top:
          document.body.scrollHeight,

        behavior:
          'smooth'

      });

    },
    50
  );

}



/* =====================================================
   Error
===================================================== */


function showError(message){

  const box =
    document.createElement('div');

  box.className =
    'message error';

  box.textContent =
    message;


  addToChat(
    box
  );

}



/* =====================================================
   Status
===================================================== */


function setStatus(
  text,
  error
){

  const box =
    document.getElementById(
      'status'
    );


  box.style.display =
    'block';


  box.textContent =
    text;


  box.style.color =
    error
      ? '#fecaca'
      : '#9ca3af';

}



/* =====================================================
   Loading
===================================================== */


function setLoading(
  loading
){

  const button =
    document.getElementById(
      'sendButton'
    );


  button.disabled =
    loading;


  button.textContent =
    loading
      ? 'جاري الاتصال...'
      : 'إرسال';

}

</script>

</body>

</html>
