<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><meta name="description" content="منصة أكاديمية البيان التعليمية"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="أكاديمية البيان"><link rel="manifest" href="./manifest.json?v=5"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>أكاديمية البيان</title><style>
:root{--bg:#f4f7fb;--surface:#fff;--surface2:#f8fafc;--text:#111827;--muted:#64748b;--border:#e5e7eb;--primary:#7c3aed;--primary2:#5b21b6;--blue:#2563eb;--danger:#dc2626;--shadow:0 12px 35px rgba(15,23,42,.07)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0%,#ede9fe 0,transparent 28%),radial-gradient(circle at 100% 20%,#dbeafe 0,transparent 25%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}.container{width:100%;max-width:480px;margin:auto;padding:82px 15px 105px}.header{position:fixed;top:0;left:0;right:0;height:64px;z-index:100;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(226,232,240,.8);display:flex;align-items:center;justify-content:center;}.header h1{margin:0;font-size:18px;font-weight:900;background:linear-gradient(90deg,var(--primary2),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}.card{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}.card:has(input){position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid rgba(226,232,240,.9);border-bottom:0;border-radius:24px 24px 0 0;padding:11px 13px 13px;margin:0;display:flex;align-items:center;gap:9px;z-index:100;box-shadow:0 -12px 35px rgba(15,23,42,.1)}.card:has(input) label{display:none}.card:has(input) input{flex:1;margin:0;background:#f8fafc;border:1px solid #e2e8f0;border-radius:15px;padding:13px 15px;font-size:14px}.card:has(input).main-button{width:auto;min-width:76px;margin:0;padding:13px 17px;border-radius:15px;font-size:13px;box-shadow:0 7px 18px rgba(124,58,237,.25)}label{display:block;margin-bottom:8px;font-size:13px;font-weight:800}input{width:100%;padding:14px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--text);font-size:15px;outline:none;direction:ltr;text-align:left}.main-button{width:100%;border:0;padding:14px;margin-top:10px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:14px;font-weight:900;cursor:pointer;}.status{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid var(--border);font-size:12px;font-weight:700}.chat{margin-top:12px}.message{background:rgba(255,255,255,.92);border:1px solid rgba(226,232,240,.9);border-radius:22px;padding:17px;margin-bottom:15px;box-shadow:var(--shadow)}.message-title{font-size:17px;font-weight:900;margin-bottom:5px}.message-subtitle{font-size:12px;color:var(--muted);margin-bottom:15px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:11px}.menu-button{min-height:116px;border:1px solid transparent;border-radius:20px;padding:15px;background:#fff;text-align:right;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 7px 20px rgba(15,23,42,.06)}.menu-title{font-size:14px;font-weight:900}.menu-subtitle{font-size:11px;font-weight:700;margin-top:8px;opacity:.72}.menu-button:nth-child(1){background:linear-gradient(145deg,#ede9fe,#ddd6fe);color:#4c1d95}.menu-button:nth-child(2){background:linear-gradient(145deg,#dbeafe,#bfdbfe);color:#1e3a8a}.menu-button:nth-child(3){background:linear-gradient(145deg,#dcfce7,#bbf7d0);color:#14532d}.menu-button:nth-child(4){background:linear-gradient(145deg,#fef3c7,#fde68a);color:#78350f}.menu-button:nth-child(5){background:linear-gradient(145deg,#fce7f3,#fbcfe8);color:#831843}.menu-button:nth-child(6){background:linear-gradient(145deg,#cffafe,#a5f3fc);color:#164e63}.menu-button:nth-child(7){grid-column:1/-1;min-height:82px;background:linear-gradient(135deg,#111827,#312e81);color:#fff;flex-direction:row;align-items:center}.data{display:flex;flex-direction:column;gap:8px}.data-item{background:var(--surface2);border:1px solid var(--border);border-radius:15px;padding:13px;display:flex;justify-content:space-between;align-items:center}.back{width:100%;margin-top:13px;padding:13px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;font-weight:800;cursor:pointer}#installBtn{display:none;width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:900;cursor:pointer}
</style></head><body><div class="container"><div class="header"><h1>أكاديمية البيان</h1></div><div class="card"><label>ID المستخدم</label><input id="senderId" type="text" placeholder="اكتب ID المستخدم" autocomplete="off"><button id="sendButton" class="main-button" onclick="start()">إرسال</button><div id="status" class="status"></div></div><button id="installBtn">📲 ثبت التطبيق</button><div id="chat" class="chat"></div></div><div id="examOverlay"><div id="examBanner"></div></div><script>
if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js",{scope:"./"}).then(r=>console.log("SW registered")).catch(e=>console.error("SW failed",e)))}
let deferredPrompt;const installBtn=document.getElementById("installBtn");window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display="block"});installBtn.addEventListener("click",async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const {outcome}=await deferredPrompt.userChoice;if(outcome==="accepted"){installBtn.style.display="none"}deferredPrompt=null});
const API_URL="https://script.google.com/macros/s/AKfycbyurDCGEG97uPfYN7CZt5LpEwcySalDEZ-ia4zFwJF40ued4GHj5vuN-pZFKKx0TvUBVQ/exec",SECRET="CHANGE_THIS_SECRET";let currentSenderId="",requestNumber=0;
function start(){const id=document.getElementById("senderId").value.trim();if(!id){setStatus("من فضلك أدخل ID المستخدم",true);return}currentSenderId=id;document.getElementById("chat").innerHTML="";request(id,"")}
function request(senderId,payload){setLoading(true);const callback="response_"+ ++requestNumber,params=new URLSearchParams();params.set("senderId",senderId);params.set("secret",SECRET);params.set("callback",callback);if(payload)params.set("payload",payload);const url=API_URL+"?"+params.toString(),script=document.createElement("script");script.src=url;script.async=true;window[callback]=response=>{try{handleResponse(response)}finally{delete window[callback];script.remove();setLoading(false)}};script.onerror=()=>{delete window[callback];script.remove();setLoading(false);showError("فشل الاتصال بمشروع Google Apps Script")};document.body.appendChild(script)}
function handleResponse(response){if(!response){showError("لم يصل رد من السيرفر");return}if(!response.success){showError(response.error||"حدث خطأ");return}render(response.data);setStatus("تم استلام الرد",false)}
function render(data){if(!data){showError("الرد فارغ");return}if(data.type==="exams"){if(typeof renderExamResponse==="function")renderExamResponse(data.data||{});else showError("ملف exam.js غير محمل");return}if(data.type==="examSubmit"){if(typeof handleExamSubmitResponse==="function")handleExamSubmitResponse(data);else showError(data.message||"تم استلام نتيجة الاختبار");return}if(data.type==="menu"){renderMenu(data);return}renderGeneric(data)}
function renderMenu(data){const box=createMessage(data.title||"القائمة الرئيسية");if(data.subtitle){const subtitle=document.createElement("div");subtitle.className="message-subtitle";subtitle.textContent=data.subtitle;box.appendChild(subtitle)}const menu=document.createElement("div");menu.className="menu";const items=Array.isArray(data.items)?data.items:[];items.forEach(item=>{const button=document.createElement("button");button.className="menu-button";const title=document.createElement("span");title.className="menu-title";title.textContent=item.title||"اختيار";const subtitle=document.createElement("span");subtitle.className="menu-subtitle";subtitle.textContent=item.subtitle||"";button.appendChild(title);button.appendChild(subtitle);button.onclick=()=>request(currentSenderId,item.payload);menu.appendChild(button)});box.appendChild(menu);addToChat(box)}
function renderGeneric(data){const box=createMessage(data.title||"النتيجة");if(data.text){const text=document.createElement("div");text.textContent=data.text;box.appendChild(text)}if(data.data){const dataBox=document.createElement("div");dataBox.className="data";renderValue(data.data,dataBox);box.appendChild(dataBox)}const back=document.createElement("button");back.className="back";back.textContent="⬅ العودة للقائمة الرئيسية";back.onclick=()=>request(currentSenderId,"MAIN_MENU");box.appendChild(back);addToChat(box)}
function renderValue(value,parent){if(Array.isArray(value)){value.forEach(item=>{const itemBox=document.createElement("div");itemBox.className="array-item";if(typeof item==="object"&&item!==null)renderValue(item,itemBox);else itemBox.textContent=String(item);parent.appendChild(itemBox)});return}if(typeof value==="object"&&value!==null){Object.keys(value).forEach(key=>{const item=document.createElement("div");item.className="data-item";const keyElement=document.createElement("div");keyElement.textContent=key;const valueElement=document.createElement("div");valueElement.textContent=String(value[key]??"");item.appendChild(keyElement);item.appendChild(valueElement);parent.appendChild(item)});return}}
function createMessage(title){const box=document.createElement("div");box.className="message";const titleElement=document.createElement("div");titleElement.className="message-title";titleElement.textContent=title;box.appendChild(titleElement);return box}
function addToChat(element){const chat=document.getElementById("chat");chat.appendChild(element);setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),80)}
function showError(message){const box=document.createElement("div");box.className="message";box.textContent=message;addToChat(box)}
function setStatus(text,error){const box=document.getElementById("status");box.style.display="block";box.textContent=text;box.style.color=error?"#9f1239":"#475569";}
function setLoading(loading){const button=document.getElementById("sendButton");button.disabled=loading;button.textContent=loading?"جاري الاتصال...":"إرسال"}
</script><script src="./exam.js"></script><script src="./exam-submit.js"></script></body></html>
