<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>أكاديمية البيان</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 font-family:Arial,Tahoma,sans-serif;
 background:#eef1f5;
 color:#1c1e21;
}

body{
 display:flex;
 justify-content:center;
}

.app{
 width:100%;
 height:100vh;
 display:flex;
 flex-direction:column;
 background:#fff;
}

/* الهيدر */

.header{
 height:64px;
 flex-shrink:0;
 background:#0866ff;
 color:#fff;
 display:flex;
 align-items:center;
 gap:12px;
 padding:0 16px;
}

.logo{
 width:42px;
 height:42px;
 border-radius:50%;
 background:#fff;
 color:#0866ff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:21px;
 font-weight:bold;
}

.headerText{
 flex:1;
}

.headerText b{
 display:block;
 font-size:17px;
}

.headerText span{
 font-size:12px;
 opacity:.9;
}

.online{
 width:9px;
 height:9px;
 border-radius:50%;
 background:#35d46a;
}

/* شاشة تسجيل الدخول */

.login{
 position:fixed;
 inset:0;
 z-index:20;
 background:#eef1f5;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.loginBox{
 width:100%;
 max-width:420px;
 background:#fff;
 border-radius:20px;
 padding:28px 22px;
 box-shadow:0 5px 30px #0002;
 text-align:center;
}

.loginLogo{
 width:72px;
 height:72px;
 margin:auto auto 15px;
 border-radius:50%;
 background:#0866ff;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:30px;
 font-weight:bold;
}

.loginBox h2{
 margin:5px 0 8px;
 font-size:23px;
}

.loginBox p{
 margin:0 0 20px;
 color:#65676b;
 font-size:14px;
}

.idInput{
 width:100%;
 height:48px;
 border:1px solid #ccd0d5;
 border-radius:12px;
 padding:0 15px;
 text-align:center;
 font-size:16px;
 outline:none;
}

.idInput:focus{
 border-color:#0866ff;
 box-shadow:0 0 0 2px #0866ff22;
}

.startBtn{
 width:100%;
 height:48px;
 margin-top:12px;
 border:0;
 border-radius:12px;
 background:#0866ff;
 color:#fff;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

/* الشات */

.chat{
 flex:1;
 min-height:0;
 overflow-y:auto;
 padding:18px 15px 20px;
 background:#fff;
 scroll-behavior:smooth;
}

.welcome{
 text-align:center;
 color:#65676b;
 font-size:13px;
 margin:5px auto 20px;
}

/* رسالة المستخدم */

.userMessage{
 max-width:80%;
 margin:8px 0 8px auto;
 background:#0866ff;
 color:#fff;
 border-radius:18px 18px 5px 18px;
 padding:10px 14px;
 line-height:1.7;
 font-size:15px;
 word-break:break-word;
}

/* رسالة السيرفر */

.serverMessage{
 max-width:80%;
 margin:8px auto 8px 0;
 background:#e4e6eb;
 color:#1c1e21;
 border-radius:18px 18px 18px 5px;
 padding:10px 14px;
 line-height:1.7;
 font-size:15px;
 white-space:pre-wrap;
 word-break:break-word;
}

/* الأزرار */

.menu{
 width:100%;
 max-width:850px;
 margin:12px auto 18px;
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}

.menuButton{
 width:100%;
 border:1px solid #e0e3e7;
 background:#fff;
 border-radius:15px;
 padding:15px;
 text-align:right;
 cursor:pointer;
 box-shadow:0 2px 8px #0000000d;
 transition:.15s;
}

.menuButton:hover{
 background:#f5f7fa;
 transform:translateY(-1px);
}

.menuButton:active{
 transform:scale(.98);
}

.menuIcon{
 font-size:23px;
 margin-bottom:7px;
}

.menuButton b{
 display:block;
 font-size:15px;
}

.menuButton span{
 display:block;
 color:#65676b;
 font-size:12px;
 margin-top:5px;
 line-height:1.5;
}

/* التحميل */

.loading{
 text-align:center;
 color:#65676b;
 font-size:13px;
 padding:10px;
}

/* الخطأ */

.error{
 max-width:80%;
 margin:8px auto 8px 0;
 background:#ffe5e8;
 color:#b4232d;
 border-radius:14px;
 padding:11px 14px;
 font-size:13px;
}

/* الأسفل */

.bottom{
 min-height:62px;
 flex-shrink:0;
 border-top:1px solid #ddd;
 background:#fff;
 padding:9px 12px;
 display:flex;
 align-items:center;
 gap:8px;
}

.bottomInput{
 flex:1;
 height:43px;
 border:1px solid #ccd0d5;
 border-radius:22px;
 padding:0 16px;
 outline:none;
 font-size:14px;
 background:#f0f2f5;
}

.homeBtn{
 width:43px;
 height:43px;
 border:0;
 border-radius:50%;
 background:#0866ff;
 color:#fff;
 font-size:19px;
 cursor:pointer;
}

/* الشاشات الكبيرة */

@media(min-width:900px){
 .app{
  max-width:1100px;
  box-shadow:0 0 25px #0002;
 }

 .chat{
  padding-left:40px;
  padding-right:40px;
 }

 .menu{
  max-width:900px;
  grid-template-columns:repeat(3,minmax(0,1fr));
 }
}

/* الموبايل */

@media(max-width:600px){
 .menu{
  grid-template-columns:1fr;
 }

 .serverMessage,
 .userMessage{
  max-width:90%;
 }

 .chat{
  padding:15px 10px;
 }
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->

<div id="login" class="login">

 <div class="loginBox">

  <div class="loginLogo">ب</div>

  <h2>أكاديمية البيان</h2>

  <p>أدخل ID الطالب للبدء</p>

  <input
   id="studentId"
   class="idInput"
   type="text"
   inputmode="numeric"
   autocomplete="off"
   placeholder="ID الطالب">

  <button class="startBtn" onclick="startChat()">
   ابدأ
  </button>

 </div>

</div>


<!-- التطبيق -->

<div class="app">

 <div class="header">

  <div class="logo">ب</div>

  <div class="headerText">
   <b>أكاديمية البيان</b>
   <span>المساعد الطلابي</span>
  </div>

  <div class="online"></div>

 </div>


 <!-- منطقة الشات -->

 <div id="chat" class="chat">

  <div class="welcome">
   أهلًا بك في أكاديمية البيان 👋
  </div>

 </div>


 <!-- الشريط السفلي -->

 <div class="bottom">

  <input
   class="bottomInput"
   id="statusInput"
   value="اختر من القائمة..."
   disabled>

  <button
   class="homeBtn"
   onclick="sendPayload('MAIN_MENU')">
   ⌂
  </button>

 </div>

</div>


<script>

/* =========================
   إعداد الاتصال
========================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbw9utjlPZyqeNic1edJmm-e0L86nlnDV1jNF8-37DqxFwt-j8uAyoqNN1BiGRaNeNC3/exec';


/* =========================
   بيانات الجلسة
========================= */

let studentId='';
let callbackNumber=0;


/* =========================
   بدء الجلسة
========================= */

function startChat(){

 const id=
 document.getElementById('studentId')
 .value
 .trim();

 if(!id){

  alert('من فضلك أدخل ID الطالب');

  return;
 }

 studentId=id;

 document.getElementById('login').style.display='none';

 const chat=document.getElementById('chat');

 chat.innerHTML=
 '<div class="welcome">'+
 'تم تسجيل الدخول بالـ ID: '+
 escapeHtml(id)+
 '</div>';

 /*
  أول طلب:
  نفس payload الذي ينتظره
  Google Apps Script
 */

 sendPayload('MAIN_MENU');
}


/* =========================
   إرسال Payload
========================= */

function sendPayload(payload){

 if(!studentId)return;


 /*
  إظهار اختيار المستخدم
 */

 const title=
 getPayloadTitle(payload);

 if(title){

  addUserMessage(title);

 }


 /*
  Loading
 */

 const loadingId=
 'loading_'+Date.now();

 addLoading(loadingId);


 /*
  JSONP Callback
 */

 const callback=
 'callback_'+(++callbackNumber);


 window[callback]=function(data){

  delete window[callback];

  const script=
  document.getElementById(callback);

  if(script)
   script.remove();


  removeLoading(loadingId);


  /*
   استقبال رد Google Apps Script
  */

  if(!data){

   addError('لم يصل رد من الخادم');

   return;
  }


  if(data.ok===false){

   addError(
    data.error||
    'حدث خطأ في الخادم'
   );

   return;
  }


  /*
   هنا يتم عرض النتيجة
  */

  renderResponse(data.result);

 };


 /*
  إنشاء Script request
 */

 const script=
 document.createElement('script');

 script.id=callback;

 script.src=
 API_URL+
 '?studentId='+
 encodeURIComponent(studentId)+
 '&payload='+
 encodeURIComponent(payload)+
 '&callback='+
 encodeURIComponent(callback)+
 '&_='+
 Date.now();


 script.onerror=function(){

  delete window[callback];

  script.remove();

  removeLoading(loadingId);

  addError(
   'تعذر الاتصال بـ Google Apps Script'
  );

 };


 document.body.appendChild(script);
}


/* =========================
   استقبال نتيجة السيرفر
========================= */

function renderResponse(data){

 if(!data)
  return;


 /*
  لو السيرفر أرسل قائمة أزرار
 */

 if(data.type==='menu'){

  renderMenu(
   data.elements||[]
  );

  return;
 }


 /*
  لو السيرفر أرسل رسالة
 */

 if(data.type==='message'){

  addServerMessage(
   data.text||''
  );

  return;
 }


 /*
  دعم أي رد يحتوي text
 */

 if(data.text){

  addServerMessage(
   data.text
  );

  return;
 }


 /*
  دعم buttons
 */

 if(data.buttons){

  renderMenu(
   data.buttons
  );

  return;
 }


 /*
  أي بيانات أخرى
 */

 addServerMessage(
  JSON.stringify(
   data,
   null,
   2
  )
 );
}


/* =========================
   عرض الأزرار
========================= */

function renderMenu(items){

 const chat=
 document.getElementById('chat');


 const menu=
 document.createElement('div');

 menu.className='menu';


 items.forEach(item=>{

  const button=
  document.createElement('button');

  button.className='menuButton';


  button.innerHTML=
   '<div class="menuIcon">'+
   getIcon(item.title||'')+
   '</div>'+
   '<b>'+
   escapeHtml(item.title||'')+
   '</b>'+
   '<span>'+
   escapeHtml(item.subtitle||'')+
   '</span>';


  /*
   أهم نقطة:

   الزر لا يحتوي منطق جديد.

   يأخذ payload القادم من
   Google Apps Script
   ويرسله مرة أخرى كما هو.
  */

  if(item.payload){

   button.onclick=function(){

    sendPayload(
     item.payload
    );

   };

  }


  menu.appendChild(button);

 });


 chat.appendChild(menu);

 scrollBottom();
}


/* =========================
   رسالة المستخدم
========================= */

function addUserMessage(text){

 const chat=
 document.getElementById('chat');

 const div=
 document.createElement('div');

 div.className=
 'userMessage';

 div.textContent=text;

 chat.appendChild(div);

 scrollBottom();
}


/* =========================
   رسالة السيرفر
========================= */

function addServerMessage(text){

 const chat=
 document.getElementById('chat');

 const div=
 document.createElement('div');

 div.className=
 'serverMessage';

 div.textContent=text;

 chat.appendChild(div);

 scrollBottom();
}


/* =========================
   Loading
========================= */

function addLoading(id){

 const chat=
 document.getElementById('chat');

 const div=
 document.createElement('div');

 div.className='loading';

 div.id=id;

 div.textContent=
 'جاري التحميل...';

 chat.appendChild(div);

 scrollBottom();
}


function removeLoading(id){

 const element=
 document.getElementById(id);

 if(element)
  element.remove();
}


/* =========================
   Error
========================= */

function addError(text){

 const chat=
 document.getElementById('chat');

 const div=
 document.createElement('div');

 div.className='error';

 div.textContent=text;

 chat.appendChild(div);

 scrollBottom();
}


/* =========================
   التمرير لآخر رسالة
========================= */

function scrollBottom(){

 const chat=
 document.getElementById('chat');

 setTimeout(()=>{

  chat.scrollTop=
  chat.scrollHeight;

 },20);
}


/* =========================
   عنوان Payload
========================= */

function getPayloadTitle(payload){

 const titles={

  MAIN_MENU:'القائمة الرئيسية',

  MAIN_ACCOUNT:'👤 حسابك',

  MAIN_HOMEWORK:'📝 الواجب',

  MAIN_EXAMS:'📚 الاختبارات',

  MAIN_TEACHER_EVALUATION:'⭐ تقييم المعلم',

  MAIN_EXAM_RESULTS:'🏆 نتيجة الاختبار',

  MAIN_MEETINGS:'🎥 الميتنج',

  MAIN_SUBSCRIPTIONS:'📅 الاشتراكات والمواعيد',

  MAIN_INVOICE:'💰 الفاتورة'

 };

 return titles[payload]||'';
}


/* =========================
   الأيقونات
========================= */

function getIcon(title){

 if(title.includes('حساب'))
  return '👤';

 if(title.includes('واجب'))
  return '📝';

 if(title.includes('اختبار'))
  return '📚';

 if(title.includes('تقييم'))
  return '⭐';

 if(title.includes('نتيجة'))
  return '🏆';

 if(title.includes('ميتنج'))
  return '🎥';

 if(title.includes('اشتراك'))
  return '📅';

 if(title.includes('فاتورة'))
  return '💰';

 return '📌';
}


/* =========================
   حماية HTML
========================= */

function escapeHtml(value){

 return String(value)
 .replace(/[&<>"']/g,function(char){

  return {

   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#039;'

  }[char];

 });
}


/* =========================
   Enter
========================= */

document
.getElementById('studentId')
.addEventListener(
 'keydown',
 function(e){

  if(e.key==='Enter')
   startChat();

 }
);

</script>

</body>
</html>
