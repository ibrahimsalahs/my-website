<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0b1220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="أكاديمية البيان">

    <meta name="description"
          content="منصة أكاديمية البيان التعليمية">

    <link rel="manifest" href="manifest.json">

    <link rel="icon"
          type="image/png"
          sizes="192x192"
          href="file_000000004b1c822f832d57514330ad17.png">

    <link rel="apple-touch-icon"
          href="file_000000004b1c822f832d57514330ad17.png">

    <title>أكاديمية البيان</title>
<style>
:root{
  --bg:#ffffff;
  --bg-soft:#f8fafc;
  --card:#ffffff;
  --border:#eef2f7;
  --text:#0f172a;
  --muted:#475569;
  --muted-light:#94a3b8;
  --primary:#2563eb;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family: Tahoma, Arial, sans-serif;
}

/* عشان الشريط اللي فوق واللي تحت ثابتين */
.container{
  width:100%;
  max-width:460px;
  margin:0 auto;
  padding:72px 14px 92px;
}

/* ===== شريط فوق ثابت في النص ===== */
.header{
  position:fixed !important;
  top:0; left:0; right:0;
  height:58px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  z-index:100;
  display:flex !important;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin-bottom:0 !important;
  text-align:center;
}
.header h1{
  margin:0;
  font-size:16px;
  font-weight:900;
  color:var(--text);
  letter-spacing:-.2px;
}
.header p{ display:none; }

/* ===== الكروت العادية ===== */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 12px rgba(15,23,42,.04);
}

/* ===== حقل الادخال ثابت اسفل الصفحة ===== */
.card:has(input){
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:460px;
  background:#fff;
  border:1px solid var(--border);
  border-bottom:0;
  border-radius:20px 20px 0 0;
  padding:10px 12px 12px;
  margin-bottom:0;
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:10px;
  box-shadow:0 -8px 30px rgba(15,23,42,.08);
  z-index:100;
}
.card:has(input) label{ display:none; }
.card:has(input) input{
  flex:1;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:999px;
  padding:12px 18px;
  font-size:14px;
}
.card:has(input) .main-button{
  width:auto;
  margin-top:0;
  padding:12px 20px;
  border-radius:999px;
  min-width:72px;
  font-size:14px;
  box-shadow:none;
}

label{ display:block; margin-bottom:8px; color:var(--text); font-size:13px; font-weight:700; }
input{
  width:100%; padding:14px; border-radius:12px;
  border:1px solid var(--border); background:#fff; color:var(--text);
  font-size:15px; direction:ltr; text-align:left; outline:none;
}
input:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.1); }

.main-button{
  width:100%; padding:13px; margin-top:10px; border:0; border-radius:12px;
  background:var(--primary); color:#fff; font-size:14px; font-weight:800; cursor:pointer;
}
.main-button:disabled{ opacity:.5; }
.status{
  display:none; margin-top:12px; padding:12px; border-radius:12px;
  background:#fff; border:1px solid var(--border); color:var(--muted); font-size:13px;
}

.chat{ margin-top:10px; }
.message{
  background:var(--card); border:1px solid var(--border); border-radius:18px;
  padding:16px; margin-bottom:14px; box-shadow:0 2px 12px rgba(15,23,42,.04);
}
.message-title{ font-size:16px; font-weight:900; margin-bottom:4px; color:var(--text); }
.message-subtitle{ color:var(--muted); font-size:12px; margin-bottom:14px; }

/* ===== الزراير كل 2 جنب بعض ستايل بنك ===== */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.menu-button{
  width:100%;
  min-height:102px;
  padding:16px 14px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  cursor:pointer;
  text-align:right;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 4px 14px rgba(15,23,42,.04);
  transition:.2s ease;
}
.menu-button:active{ transform:scale(.97); }
.menu-title{
  font-size:14.5px;
  font-weight:900;
  color:var(--text) !important;
  line-height:1.3;
}
.menu-subtitle{
  font-size:11.5px;
  font-weight:600;
  margin-top:8px;
  line-height:1.4;
  color:#334155 !important;
  opacity:.9;
}
/* الوان بنك لكل زرار */
.menu-button:nth-child(1){ background:#eff6ff; border-color:#dbeafe; }
.menu-button:nth-child(2){ background:#fef3c7; border-color:#fde68a; }
.menu-button:nth-child(3){ background:#f3e8ff; border-color:#e9d5ff; }
.menu-button:nth-child(4){ background:#ecfeff; border-color:#a5f3fc; }
.menu-button:nth-child(5){ background:#dcfce7; border-color:#bbf7d0; }
.menu-button:nth-child(6){ background:#fff1f2; border-color:#fecdd3; }
.menu-button:nth-child(7){ background:#e0e7ff; border-color:#c7d2fe; grid-column:1 / -1; min-height:88px; flex-direction:row; align-items:center; }
.menu-button:nth-child(7) .menu-subtitle{ margin-top:0; margin-right:10px; }

.back{
  width:100%; margin-top:12px; padding:13px; background:#fff;
  border:1px solid var(--border); border-radius:12px; color:var(--text); cursor:pointer; font-weight:700;
}

.data{ display:flex; flex-direction:column; gap:8px; }
.data-item{
  background:#fff; border:1px solid var(--border); border-radius:14px;
  padding:14px; display:flex; justify-content:space-between; align-items:center;
  box-shadow:0 1px 6px rgba(15,23,42,.03);
}
.data-key{ color:var(--muted-light); font-size:11px; font-weight:700; margin-bottom:2px; }
.data-value{ color:var(--text); font-size:14px; font-weight:800; word-break:break-word; }

.array-item{
  background:#fff; border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-bottom:8px; box-shadow:0 1px 6px rgba(15,23,42,.03);
}

.error{ background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:12px; padding:12px; }
.loading{ text-align:center; padding:20px; color:var(--muted); }
pre{
  direction:ltr; text-align:left; white-space:pre-wrap; word-break:break-word;
  color:#0f172a; background:var(--bg-soft); border:1px solid var(--border); border-radius:12px; padding:12px;
  font-weight:600;
}

/* ===== صفحة الامتحان - كل الـ ID موجودة ===== */
#examOverlay{
  display:none; position:fixed; inset:0; z-index:9999;
  background:#ffffff; overflow-y:auto;
}
#examBanner{ width:100%; min-height:100vh; padding:72px 14px 20px; }
.exam-container{ width:100%; max-width:460px; margin:auto; }
.exam-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
.exam-title{ font-size:19px; font-weight:900; }
.exam-close{
  width:40px; height:40px; border:1px solid var(--border); border-radius:12px;
  background:#fff; color:var(--text); font-size:20px; cursor:pointer;
}
.exam-student, .exam-section{
  background:#fff; border:1px solid var(--border); border-radius:18px;
  padding:16px; margin-bottom:14px; box-shadow:0 2px 12px rgba(15,23,42,.04);
}
.exam-section-title{ font-size:15px; font-weight:900; margin-bottom:12px; color:var(--text); }
.exam-question{
  background:var(--bg-soft); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-bottom:10px;
}
.exam-question-text{ font-size:14px; line-height:1.8; margin-bottom:10px; font-weight:700; color:var(--text); }
.exam-option{
  display:flex; align-items:center; gap:8px;
  padding:11px 12px; margin-top:8px; background:#fff;
  border:1px solid var(--border); border-radius:11px; cursor:pointer; font-weight:600;
}
.exam-option input{ width:auto; margin-left:8px; }
.exam-text-input{
  width:100%; background:#fff; border:1px solid var(--border); color:var(--text);
  border-radius:11px; padding:12px; font-size:14px; direction:rtl; text-align:right;
}
.exam-submit{
  width:100%; padding:14px; border:0; border-radius:12px;
  background:var(--primary); color:#fff; font-size:15px; font-weight:800; cursor:pointer; margin-top:8px;
}
.exam-submit:disabled{ opacity:.5; }
.exam-message{
  padding:14px; border-radius:12px; margin-bottom:14px;
  background:var(--bg-soft); border:1px solid var(--border); color:var(--text); font-weight:600;
}
.exam-success{ background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; }
.exam-error{ background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
.exam-passage{
  background:#f8fafc; border:1px solid var(--border); border-radius:12px;
  padding:14px; line-height:1.9; margin-bottom:12px; color:var(--text); font-weight:600;
}
</style></head><body><div class="container">  <div class="header"><h1>أكاديمية البيان</h1>

<p>واجهة اختبار مشروع الطلاب</p>

  </div>  <div class="card"><label>

  ID المستخدم

</label>


<input
  id="senderId"
  type="text"
  placeholder="اكتب ID المستخدم"
  autocomplete="off"
>


<button
  id="sendButton"
  class="main-button"
  onclick="start()"
>

  إرسال

</button>


<div
  id="status"
  class="status"
></div>

  </div>  <div
    id="chat"
    class="chat"
  ></div></div><!-- =====================================================
     EXAM OVERLAY
===================================================== --><div
  id="examOverlay"
>  <div
    id="examBanner"
  ><!--
  exam.js
  سيضع محتوى الاختبار هنا
-->

  </div></div><script>


/* =====================================================
   إعدادات
===================================================== */


const API_URL =
  'https://script.google.com/macros/s/AKfycbyurDCGEG97uPfYN7CZt5LpEwcySalDEZ-ia4zFwJF40ued4GHj5vuN-pZFKKx0TvUBVQ/exec';


const SECRET =
  'CHANGE_THIS_SECRET';



/* =====================================================
   متغيرات
===================================================== */


let currentSenderId = '';

let requestNumber = 0;



/* =====================================================
   بدء
===================================================== */


function start(){

  const id =
    document
      .getElementById('senderId')
      .value
      .trim();


  if(!id){

    setStatus(
      'من فضلك أدخل ID المستخدم',
      true
    );

    return;

  }


  currentSenderId =
    id;


  document
    .getElementById('chat')
    .innerHTML = '';


  request(
    id,
    ''
  );

}



/* =====================================================
   الطلب
===================================================== */


function request(
  senderId,
  payload
){

  setLoading(true);


  const callback =
    'response_' +
    (++requestNumber);


  const params =
    new URLSearchParams();


  params.set(
    'senderId',
    senderId
  );


  params.set(
    'secret',
    SECRET
  );


  params.set(
    'callback',
    callback
  );


  if(payload){

    params.set(
      'payload',
      payload
    );

  }


  const url =
    API_URL +
    '?' +
    params.toString();


  const script =
    document.createElement('script');


  script.src =
    url;


  script.async =
    true;


  window[callback] =
    function(response){

      try{

        handleResponse(
          response
        );

      }finally{

        delete window[callback];

        script.remove();

        setLoading(false);

      }

    };


  script.onerror =
    function(){

      delete window[callback];

      script.remove();

      setLoading(false);

      showError(
        'فشل الاتصال بمشروع Google Apps Script'
      );

    };


  document
    .body
    .appendChild(script);

}



/* =====================================================
   استقبال الرد
===================================================== */


function handleResponse(response){

  console.log(
    'SERVER:',
    response
  );


  if(!response){

    showError(
      'لم يصل رد من السيرفر'
    );

    return;

  }


  if(!response.success){

    showError(
      response.error ||
      'حدث خطأ'
    );

    return;

  }


  render(
    response.data
  );


  setStatus(
    'تم استلام الرد',
    false
  );

}



/* =====================================================
   عرض الرد
===================================================== */


function render(data){

  if(!data){

    showError(
      'الرد فارغ'
    );

    return;

  }


  /* ===================================================
     الاختبارات
  =================================================== */

  if(data.type === 'exams'){

    if(
      typeof renderExamResponse ===
      'function'
    ){

      renderExamResponse(
        data.data || {}
      );

    }else{

      showError(
        'ملف exam.js غير محمل'
      );

    }

    return;

  }


  /* ===================================================
     نتيجة إرسال الاختبار
  =================================================== */

  if(data.type === 'examSubmit'){

    if(
      typeof handleExamSubmitResponse ===
      'function'
    ){

      handleExamSubmitResponse(
        data
      );

    }else{

      showError(
        data.message ||
        'تم استلام نتيجة الاختبار'
      );

    }

    return;

  }


  /* ===================================================
     القائمة الرئيسية
  =================================================== */

  if(data.type === 'menu'){

    renderMenu(data);

    return;

  }


  renderGeneric(
    data
  );

}



/* =====================================================
   القائمة
===================================================== */


function renderMenu(data){

  const box =
    createMessage(
      data.title ||
      'القائمة الرئيسية'
    );


  if(data.subtitle){

    const subtitle =
      document.createElement('div');

    subtitle.className =
      'message-subtitle';

    subtitle.textContent =
      data.subtitle;

    box.appendChild(
      subtitle
    );

  }


  const menu =
    document.createElement('div');

  menu.className =
    'menu';


  const items =
    Array.isArray(data.items)
      ? data.items
      : [];


  items.forEach(
    function(item){

      const button =
        document.createElement('button');


      button.className =
        'menu-button';


      const title =
        document.createElement('span');

      title.className =
        'menu-title';

      title.textContent =
        item.title || 'اختيار';


      const subtitle =
        document.createElement('span');

      subtitle.className =
        'menu-subtitle';

      subtitle.textContent =
        item.subtitle || '';


      button.appendChild(
        title
      );

      button.appendChild(
        subtitle
      );


      button.onclick =
        function(){

          request(
            currentSenderId,
            item.payload
          );

        };


      menu.appendChild(
        button
      );

    }
  );


  box.appendChild(
    menu
  );


  addToChat(
    box
  );

}



/* =====================================================
   عرض الردود والبيانات
===================================================== */


function renderGeneric(data){

  const box =
    createMessage(
      data.title ||
      'النتيجة'
    );


  if(data.text){

    const text =
      document.createElement('div');

    text.textContent =
      data.text;

    box.appendChild(
      text
    );

  }


  if(data.data){

    const dataBox =
      document.createElement('div');

    dataBox.className =
      'data';


    renderValue(
      data.data,
      dataBox
    );


    box.appendChild(
      dataBox
    );

  }


  const ignored = [
    'type',
    'title',
    'subtitle',
    'text',
    'data'
  ];


  const extra = {};


  Object.keys(data)
    .forEach(
      function(key){

        if(
          !ignored.includes(key)
        ){

          extra[key] =
            data[key];

        }

      }
    );


  if(
    Object.keys(extra).length
  ){

    const extraBox =
      document.createElement('div');

    extraBox.className =
      'data';


    renderValue(
      extra,
      extraBox
    );


    box.appendChild(
      extraBox
    );

  }


  const back =
    document.createElement('button');

  back.className =
    'back';

  back.textContent =
    '⬅ العودة للقائمة الرئيسية';


  back.onclick =
    function(){

      request(
        currentSenderId,
        'MAIN_MENU'
      );

    };


  box.appendChild(
    back
  );


  addToChat(
    box
  );

}



/* =====================================================
   عرض Object / Array / String
===================================================== */


function renderValue(
  value,
  parent
){

  if(Array.isArray(value)){

    value.forEach(
      function(item){

        const itemBox =
          document.createElement('div');

        itemBox.className =
          'array-item';


        if(
          typeof item === 'object' &&
          item !== null
        ){

          renderValue(
            item,
            itemBox
          );

        }else{

          itemBox.textContent =
            String(item);

        }


        parent.appendChild(
          itemBox
        );

      }
    );

    return;

  }


  if(
    typeof value === 'object' &&
    value !== null
  ){

    Object.keys(value)
      .forEach(
        function(key){

          const item =
            document.createElement('div');

          item.className =
            'data-item';


          const keyElement =
            document.createElement('div');

          keyElement.className =
            'data-key';

          keyElement.textContent =
            key;


          const valueElement =
            document.createElement('div');

          valueElement.className =
            'data-value';


          if(
            typeof value[key] === 'object' &&
            value[key] !== null
          ){

            renderValue(
              value[key],
              valueElement
            );

          }else{

            valueElement.textContent =
              String(
                value[key] ?? ''
              );

          }


          item.appendChild(
            keyElement
          );

          item.appendChild(
            valueElement
          );


          parent.appendChild(
            item
          );

        }
      );

    return;

  }


  const item =
    document.createElement('div');

  item.className =
    'data-item';

  item.textContent =
    String(value ?? '');


  parent.appendChild(
    item

  );

}



/* =====================================================
   إنشاء رسالة
===================================================== */


function createMessage(title){

  const box =
    document.createElement('div');

  box.className =
    'message';


  const titleElement =
    document.createElement('div');

  titleElement.className =
    'message-title';

  titleElement.textContent =
    title;


  box.appendChild(
    titleElement
  );


  return box;

}



/* =====================================================
   إضافة للمحادثة
===================================================== */


function addToChat(element){

  const chat =
    document.getElementById(
      'chat'
    );


  chat.appendChild(
    element
  );


  setTimeout(
    function(){

      window.scrollTo({

        top:
          document.body.scrollHeight,

        behavior:
          'smooth'

      });

    },
    50
  );

}



/* =====================================================
   Error
===================================================== */


function showError(message){

  const box =
    document.createElement('div');

  box.className =
    'message error';

  box.textContent =
    message;


  addToChat(
    box
  );

}



/* =====================================================
   Status
===================================================== */


function setStatus(
  text,
  error
){

  const box =
    document.getElementById(
      'status'
    );


  box.style.display =
    'block';


  box.textContent =
    text;


  box.style.color =
    error
      ? '#fecaca'
      : '#9ca3af';

}



/* =====================================================
   Loading
===================================================== */


function setLoading(
  loading
){

  const button =
    document.getElementById(
      'sendButton'
    );


  button.disabled =
    loading;


  button.textContent =
    loading
      ? 'جاري الاتصال...'
      : 'إرسال';

}

</script><!-- =====================================================
     ملفات الاختبار
===================================================== --><script src="exam.js"></script><script src="exam-submit.js"></script>
