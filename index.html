<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlBayan Educational Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0}
body{background:#f8fafc;color:#0f172a}
.hero{background:linear-gradient(135deg,#0084ff,#0061ff);color:#fff;padding:60px 20px 80px;text-align:center}
.hero h1{font-size:40px;font-weight:900}
.hero p{opacity:.9;margin-top:8px}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 30px rgba(0,0,0,.08);margin-top:-40px}
.inputRow{display:flex;gap:10px;margin-top:14px}
.inputRow input{flex:1;padding:14px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;text-align:center;outline:none}
.inputRow input:focus{border-color:#0084ff}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:block;text-align:center;margin-top:10px}
.btn-blue{background:#0084ff;color:#fff}
.btn-orange{background:#f59e0b;color:#fff}
.btn-dark{background:#0f172a;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.note{margin-top:14px;background:#f1f5f9;border-radius:12px;padding:12px;font-size:13px;color:#475569;text-align:center}
@media(max-width:600px){.grid{grid-template-columns:1fr} .hero h1{font-size:30px}}
</style>
</head>
<body>
<div class="hero">
  <h1 dir="rtl">منصة البيان التعليمية</h1>
  <p dir="rtl">Download AlBayan Edu - منصتك للامتحان والواجب 🚀</p>
</div>

<div class="wrap">
  <div class="card" dir="rtl">
    <h3>تفعيل المنصة</h3>
    <p style="color:#64748b;font-size:14px;margin-top:4px">اكتب كود الطالب وهيوديك للاختبار والواجب</p>
    
    <div class="inputRow">
      <input id="codeInput" placeholder="كود الطالب - مثال: 589">
    </div>

    <div class="grid">
      <button class="btn btn-blue" onclick="go('exam.html')">📝 دخول الاختبار</button>
      <button class="btn btn-orange" onclick="go('homework.html')">📚 دخول الواجب</button>
    </div>

    <a class="btn btn-dark" href="https://m.me/YOUR_PAGE" target="_blank">💬 تفعيل على الماسنجر: Download AlBayan Edu 589</a>

    <div class="note">
      لما الطالب يكتب <b>589</b> ويدوس اختبار هيروح لـ<br>
      <span dir="ltr">.../exam.html?psid=589</span><br>
      ولو داس واجب هيروح لـ<br>
      <span dir="ltr">.../homework.html?psid=589</span>
    </div>
  </div>
</div>

<script>
function go(page){
  let c=document.getElementById('codeInput').value.trim();
  if(!c){alert('اكتب كود الطالب الأول - مثال: 589');return;}
  location.href=page+'?psid='+c;
}
</script>
</body>
</html>
