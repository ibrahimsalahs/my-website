<title>أكاديمية البيان</title>
<style>
:root{
  --bg:#ffffff;
  --bg-soft:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --border-strong:#d1d5db;
  --text:#0f172a;
  --muted:#64748b;
  --primary:#2563eb;
  --primary-hover:#1d4ed8;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family: Tahoma, Arial, sans-serif;
  line-height:1.7;
}

/* صغرت المحتوى عشان العرض يبان كبير و بروفيشنال */
.container{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:32px 20px;
}

.header{
  text-align:center;
  margin-bottom:28px;
}

.header h1{
  margin:0;
  font-size:26px;
  font-weight:800;
  color:var(--text);
  letter-spacing:-.3px;
}

.header p{
  color:var(--muted);
  margin-top:8px;
  font-size:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow: 0 4px 20px rgba(0,0,0,.04);
}

label{
  display:block;
  margin-bottom:8px;
  color:var(--text);
  font-size:14px;
  font-weight:600;
}

input{
  width:100%;
  padding:14px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  direction:ltr;
  text-align:left;
  outline:none;
  transition:.2s;
}

input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

.main-button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:var(--primary);
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.main-button:hover{
  background:var(--primary-hover);
  transform:translateY(-1px);
}

.main-button:disabled{
  opacity:.5;
  transform:none;
}

.status{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:var(--bg-soft);
  color:var(--muted);
  border:1px solid var(--border);
  font-size:13px;
}

.chat{
  margin-top:16px;
}

.message{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.04);
}

.message-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:6px;
  color:var(--text);
}

.message-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:16px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.menu-button{
  width:100%;
  padding:14px 16px;
  background:var(--bg-soft);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  cursor:pointer;
  text-align:right;
  transition:.2s;
}

.menu-button:hover{
  background:#fff;
  border-color:var(--border-strong);
  box-shadow: 0 4px 12px rgba(0,0,0,.05);
}

.menu-title{
  display:block;
  font-size:15px;
  font-weight:700;
}

.menu-subtitle{
  display:block;
  color:var(--muted);
  font-size:12.5px;
  margin-top:4px;
}

.back{
  width:100%;
  margin-top:12px;
  padding:12px;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:11px;
  color:var(--text);
  cursor:pointer;
  font-weight:600;
}

.data{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.data-item{
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
}

.data-key{
  color:var(--muted);
  font-size:12px;
  margin-bottom:4px;
  font-weight:600;
}

.data-value{
  color:var(--text);
  word-break:break-word;
  font-size:14px;
}

.array-item{
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
}

.error{
  background:#fef2f2;
  border-color:#fecaca;
  color:#991b1b;
}

.loading{
  text-align:center;
  padding:24px;
  color:var(--muted);
}

pre{
  direction:ltr;
  text-align:left;
  white-space:pre-wrap;
  word-break:break-word;
  color:#334155;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
}

/* =====================================================
   EXAM OVERLAY - نفس الـ ID
===================================================== */

#examOverlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(248,250,252,.92);
  backdrop-filter: blur(8px);
  overflow-y:auto;
}

#examBanner{
  width:100%;
  min-height:100vh;
  padding:28px 20px;
}

.exam-container{
  width:100%;
  max-width:560px;
  margin:auto;
}

.exam-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}

.exam-title{
  font-size:22px;
  font-weight:800;
  color:var(--text);
}

.exam-close{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  color:var(--text);
  font-size:20px;
  cursor:pointer;
}

.exam-student,
.exam-section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.04);
}

.exam-section-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:14px;
}

.exam-question{
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
}

.exam-question-text{
  font-size:15px;
  line-height:1.8;
  margin-bottom:10px;
}

.exam-option{
  display:block;
  padding:11px 12px;
  margin-top:8px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  cursor:pointer;
  transition:.15s;
}

.exam-option:hover{
  border-color:var(--primary);
}

.exam-option input{
  width:auto;
  margin-left:8px;
}

.exam-text-input{
  width:100%;
  background:#fff;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:11px;
  padding:12px;
  font-size:15px;
  direction:rtl;
  text-align:right;
}

.exam-submit{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}

.exam-submit:disabled{
  opacity:.5;
}

.exam-message{
  padding:14px;
  border-radius:12px;
  margin-bottom:14px;
  background:var(--bg-soft);
  color:var(--text);
  border:1px solid var(--border);
}

.exam-success{
  background:#f0fdf4;
  border-color:#bbf7d0;
  color:#166534;
}

.exam-error{
  background:#fef2f2;
  border-color:#fecaca;
  color:#991b1b;
}

.exam-passage{
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  line-height:1.9;
  margin-bottom:12px;
  color:var(--text);
}
</style></head><body><div class="container">  <div class="header"><h1>أكاديمية البيان</h1>

<p>واجهة اختبار مشروع الطلاب</p>

  </div>  <div class="card"><label>

  ID المستخدم

</label>


<input
  id="senderId"
  type="text"
  placeholder="اكتب ID المستخدم"
  autocomplete="off"
>


<button
  id="sendButton"
  class="main-button"
  onclick="start()"
>

  إرسال

</button>


<div
  id="status"
  class="status"
></div>

  </div>  <div
    id="chat"
    class="chat"
  ></div></div><!-- =====================================================
     EXAM OVERLAY
===================================================== --><div
  id="examOverlay"
>  <div
    id="examBanner"
  ><!--
  exam.js
  سيضع محتوى الاختبار هنا
-->

  </div></div><script>


/* =====================================================
   إعدادات
===================================================== */


const API_URL =
  'https://script.google.com/macros/s/AKfycbxQB40ZlHt572KLH1CXgL9fkeJ7SbhYnQ4bAbE-jKRvC1APT4x-kT-vlJwu6R8Y9OYO/exec';


const SECRET =
  'CHANGE_THIS_SECRET';



/* =====================================================
   متغيرات
===================================================== */


let currentSenderId = '';

let requestNumber = 0;



/* =====================================================
   بدء
===================================================== */


function start(){

  const id =
    document
      .getElementById('senderId')
      .value
      .trim();


  if(!id){

    setStatus(
      'من فضلك أدخل ID المستخدم',
      true
    );

    return;

  }


  currentSenderId =
    id;


  document
    .getElementById('chat')
    .innerHTML = '';


  request(
    id,
    ''
  );

}



/* =====================================================
   الطلب
===================================================== */


function request(
  senderId,
  payload
){

  setLoading(true);


  const callback =
    'response_' +
    (++requestNumber);


  const params =
    new URLSearchParams();


  params.set(
    'senderId',
    senderId
  );


  params.set(
    'secret',
    SECRET
  );


  params.set(
    'callback',
    callback
  );


  if(payload){

    params.set(
      'payload',
      payload
    );

  }


  const url =
    API_URL +
    '?' +
    params.toString();


  const script =
    document.createElement('script');


  script.src =
    url;


  script.async =
    true;


  window[callback] =
    function(response){

      try{

        handleResponse(
          response
        );

      }finally{

        delete window[callback];

        script.remove();

        setLoading(false);

      }

    };


  script.onerror =
    function(){

      delete window[callback];

      script.remove();

      setLoading(false);

      showError(
        'فشل الاتصال بمشروع Google Apps Script'
      );

    };


  document
    .body
    .appendChild(script);

}



/* =====================================================
   استقبال الرد
===================================================== */


function handleResponse(response){

  console.log(
    'SERVER:',
    response
  );


  if(!response){

    showError(
      'لم يصل رد من السيرفر'
    );

    return;

  }


  if(!response.success){

    showError(
      response.error ||
      'حدث خطأ'
    );

    return;

  }


  render(
    response.data
  );


  setStatus(
    'تم استلام الرد',
    false
  );

}



/* =====================================================
   عرض الرد
===================================================== */


function render(data){

  if(!data){

    showError(
      'الرد فارغ'
    );

    return;

  }


  /* ===================================================
     الاختبارات
  =================================================== */

  if(data.type === 'exams'){

    if(
      typeof renderExamResponse ===
      'function'
    ){

      renderExamResponse(
        data.data || {}
      );

    }else{

      showError(
        'ملف exam.js غير محمل'
      );

    }

    return;

  }


  /* ===================================================
     نتيجة إرسال الاختبار
  =================================================== */

  if(data.type === 'examSubmit'){

    if(
      typeof handleExamSubmitResponse ===
      'function'
    ){

      handleExamSubmitResponse(
        data
      );

    }else{

      showError(
        data.message ||
        'تم استلام نتيجة الاختبار'
      );

    }

    return;

  }


  /* ===================================================
     القائمة الرئيسية
  =================================================== */

  if(data.type === 'menu'){

    renderMenu(data);

    return;

  }


  renderGeneric(
    data
  );

}



/* =====================================================
   القائمة
===================================================== */


function renderMenu(data){

  const box =
    createMessage(
      data.title ||
      'القائمة الرئيسية'
    );


  if(data.subtitle){

    const subtitle =
      document.createElement('div');

    subtitle.className =
      'message-subtitle';

    subtitle.textContent =
      data.subtitle;

    box.appendChild(
      subtitle
    );

  }


  const menu =
    document.createElement('div');

  menu.className =
    'menu';


  const items =
    Array.isArray(data.items)
      ? data.items
      : [];


  items.forEach(
    function(item){

      const button =
        document.createElement('button');


      button.className =
        'menu-button';


      const title =
        document.createElement('span');

      title.className =
        'menu-title';

      title.textContent =
        item.title || 'اختيار';


      const subtitle =
        document.createElement('span');

      subtitle.className =
        'menu-subtitle';

      subtitle.textContent =
        item.subtitle || '';


      button.appendChild(
        title
      );

      button.appendChild(
        subtitle
      );


      button.onclick =
        function(){

          request(
            currentSenderId,
            item.payload
          );

        };


      menu.appendChild(
        button
      );

    }
  );


  box.appendChild(
    menu
  );


  addToChat(
    box
  );

}



/* =====================================================
   عرض الردود والبيانات
===================================================== */


function renderGeneric(data){

  const box =
    createMessage(
      data.title ||
      'النتيجة'
    );


  if(data.text){

    const text =
      document.createElement('div');

    text.textContent =
      data.text;

    box.appendChild(
      text
    );

  }


  if(data.data){

    const dataBox =
      document.createElement('div');

    dataBox.className =
      'data';


    renderValue(
      data.data,
      dataBox
    );


    box.appendChild(
      dataBox
    );

  }


  const ignored = [
    'type',
    'title',
    'subtitle',
    'text',
    'data'
  ];


  const extra = {};


  Object.keys(data)
    .forEach(
      function(key){

        if(
          !ignored.includes(key)
        ){

          extra[key] =
            data[key];

        }

      }
    );


  if(
    Object.keys(extra).length
  ){

    const extraBox =
      document.createElement('div');

    extraBox.className =
      'data';


    renderValue(
      extra,
      extraBox
    );


    box.appendChild(
      extraBox
    );

  }


  const back =
    document.createElement('button');

  back.className =
    'back';

  back.textContent =
    '⬅ العودة للقائمة الرئيسية';


  back.onclick =
    function(){

      request(
        currentSenderId,
        'MAIN_MENU'
      );

    };


  box.appendChild(
    back
  );


  addToChat(
    box
  );

}



/* =====================================================
   عرض Object / Array / String
===================================================== */


function renderValue(
  value,
  parent
){

  if(Array.isArray(value)){

    value.forEach(
      function(item){

        const itemBox =
          document.createElement('div');

        itemBox.className =
          'array-item';


        if(
          typeof item === 'object' &&
          item !== null
        ){

          renderValue(
            item,
            itemBox
          );

        }else{

          itemBox.textContent =
            String(item);

        }


        parent.appendChild(
          itemBox
        );

      }
    );

    return;

  }


  if(
    typeof value === 'object' &&
    value !== null
  ){

    Object.keys(value)
      .forEach(
        function(key){

          const item =
            document.createElement('div');

          item.className =
            'data-item';


          const keyElement =
            document.createElement('div');

          keyElement.className =
            'data-key';

          keyElement.textContent =
            key;


          const valueElement =
            document.createElement('div');

          valueElement.className =
            'data-value';


          if(
            typeof value[key] === 'object' &&
            value[key] !== null
          ){

            renderValue(
              value[key],
              valueElement
            );

          }else{

            valueElement.textContent =
              String(
                value[key] ?? ''
              );

          }


          item.appendChild(
            keyElement
          );

          item.appendChild(
            valueElement
          );


          parent.appendChild(
            item
          );

        }
      );

    return;

  }


  const item =
    document.createElement('div');

  item.className =
    'data-item';

  item.textContent =
    String(value ?? '');


  parent.appendChild(
    item

  );

}



/* =====================================================
   إنشاء رسالة
===================================================== */


function createMessage(title){

  const box =
    document.createElement('div');

  box.className =
    'message';


  const titleElement =
    document.createElement('div');

  titleElement.className =
    'message-title';

  titleElement.textContent =
    title;


  box.appendChild(
    titleElement
  );


  return box;

}



/* =====================================================
   إضافة للمحادثة
===================================================== */


function addToChat(element){

  const chat =
    document.getElementById(
      'chat'
    );


  chat.appendChild(
    element
  );


  setTimeout(
    function(){

      window.scrollTo({

        top:
          document.body.scrollHeight,

        behavior:
          'smooth'

      });

    },
    50
  );

}



/* =====================================================
   Error
===================================================== */


function showError(message){

  const box =
    document.createElement('div');

  box.className =
    'message error';

  box.textContent =
    message;


  addToChat(
    box
  );

}



/* =====================================================
   Status
===================================================== */


function setStatus(
  text,
  error
){

  const box =
    document.getElementById(
      'status'
    );


  box.style.display =
    'block';


  box.textContent =
    text;


  box.style.color =
    error
      ? '#fecaca'
      : '#9ca3af';

}



/* =====================================================
   Loading
===================================================== */


function setLoading(
  loading
){

  const button =
    document.getElementById(
      'sendButton'
    );


  button.disabled =
    loading;


  button.textContent =
    loading
      ? 'جاري الاتصال...'
      : 'إرسال';

}

</script><!-- =====================================================
     ملفات الاختبار
===================================================== --><script src="exam.js"></script><script src="exam-submit.js"></script></body></html>
