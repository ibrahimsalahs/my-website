<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أكاديمية البيان</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif}.app{max-width:600px;margin:auto;height:100vh;display:flex;flex-direction:column}.head{padding:16px;background:#111b2e;text-align:center;font-size:21px;font-weight:bold;border-bottom:1px solid #26334a}.login{padding:18px;background:#101a2c}.login input{width:100%;padding:13px;border:1px solid #33415c;border-radius:10px;background:#0b1220;color:#fff;font-size:16px;text-align:center;outline:none}.login button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.chat{flex:1;overflow-y:auto;padding:15px}.msg{background:#162238;border-radius:13px;padding:12px;margin-bottom:10px;line-height:1.7}.menu{display:flex;flex-direction:column;gap:10px}.menu button{padding:14px;border:1px solid #33415c;border-radius:11px;background:#162238;color:#fff;text-align:right;font-size:15px;cursor:pointer}.menu button:hover{background:#1d2d48}.title{font-weight:bold;font-size:17px}.sub{font-size:13px;color:#aab7ca;margin-top:3px}.loading{text-align:center;color:#9aa9bf;padding:15px}.error{background:#401b22;color:#ffb4bd;padding:12px;border-radius:10px;margin-bottom:10px}
</style>
</head>
<body>
<div class="app">
<div class="head">أكاديمية البيان</div>
<div class="login">
<input id="studentId" placeholder="أدخل كود أو ID الطالب">
<button onclick="start()">ابدأ</button>
</div>
<div id="chat" class="chat"></div>
</div>

<script>
const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbw9utjlPZyqeNic1edJmm-e0L86nlnDV1jNF8-37DqxFwt-j8uAyoqNN1BiGRaNeNC3/exec',SECRET:'CHANGE_THIS_SECRET'};
let senderId='';

async function api(payload){
 const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:CONFIG.SECRET,channel:'web',senderId,...payload})});
 if(!r.ok)throw new Error('HTTP '+r.status);
 return await r.json();
}

async function start(){
 senderId=document.getElementById('studentId').value.trim();
 if(!senderId)return alert('من فضلك أدخل ID الطالب');
 document.getElementById('chat').innerHTML='';
 await send('MAIN_MENU');
}

async function send(payload){
 const chat=document.getElementById('chat');
 chat.innerHTML+='<div class="loading">جاري التحميل...</div>';
 chat.scrollTop=chat.scrollHeight;
 try{
  const data=await api({payload});
  document.querySelectorAll('.loading').forEach(e=>e.remove());
  render(data);
 }catch(e){
  document.querySelectorAll('.loading').forEach(e=>e.remove());
  chat.innerHTML+='<div class="error">حدث خطأ أثناء الاتصال بالخادم</div>';
  console.error(e);
 }
}

function render(data){
 const chat=document.getElementById('chat');
 if(data.message)chat.innerHTML+='<div class="msg">'+escapeHtml(data.message)+'</div>';
 if(data.text)chat.innerHTML+='<div class="msg">'+escapeHtml(data.text)+'</div>';
 if(data.result)renderResult(data.result);
 if(data.menu)renderMenu(data.menu);
 chat.scrollTop=chat.scrollHeight;
}

function renderResult(r){
 const chat=document.getElementById('chat');
 if(typeof r==='string'){chat.innerHTML+='<div class="msg">'+escapeHtml(r)+'</div>';return}
 if(r.text)chat.innerHTML+='<div class="msg">'+escapeHtml(r.text)+'</div>';
 if(r.title)chat.innerHTML+='<div class="msg"><div class="title">'+escapeHtml(r.title)+'</div>'+(r.text?'<div>'+escapeHtml(r.text)+'</div>':'')+'</div>';
 if(r.buttons)renderButtons(r.buttons);
}

function renderMenu(menu){
 const chat=document.getElementById('chat');
 const box=document.createElement('div');
 box.className='menu';
 let items=menu.elements||menu;
 items.forEach(x=>{
  const b=document.createElement('button');
  b.innerHTML='<div class="title">'+escapeHtml(x.title||'')+'</div>'+(x.subtitle?'<div class="sub">'+escapeHtml(x.subtitle)+'</div>':'');
  const btn=x.buttons&&x.buttons[0];
  if(btn)b.onclick=()=>send(btn.payload);
  else if(x.payload)b.onclick=()=>send(x.payload);
  box.appendChild(b);
 });
 chat.appendChild(box);
}

function renderButtons(buttons){
 const chat=document.getElementById('chat');
 const box=document.createElement('div');
 box.className='menu';
 buttons.forEach(x=>{
  const b=document.createElement('button');
  b.textContent=x.title||'فتح';
  b.onclick=()=>send(x.payload);
  box.appendChild(b);
 });
 chat.appendChild(box);
}

function escapeHtml(v){
 return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
</script>
</body>
</html>
