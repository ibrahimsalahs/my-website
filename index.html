<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/my-website/manifest.json">
<link rel="stylesheet" href="/my-website/css/style.css">
<title>منصة أكاديمية البيان التعليمية</title>
<style>
#desktopGate{display:none;position:fixed;inset:0;background:#f5f7fa;z-index:999999;align-items:center;justify-content:center;padding:20px}
#desktopGate .gate-box{width:100%;max-width:500px;background:#fff;border-radius:25px;padding:35px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.12)}
#desktopGate .gate-icon{font-size:65px;margin-bottom:20px}
#desktopGate h1{font-size:27px;color:#10284c;margin-bottom:15px}
#desktopGate p{font-size:17px;line-height:1.9;color:#65748b;margin-bottom:20px}
#desktopGate .steps{background:#f3f6fa;border-radius:17px;padding:18px;text-align:right;line-height:2;font-size:15px;color:#243957}
#desktopGate .reload{margin-top:20px;border:0;background:#10284c;color:#fff;padding:12px 25px;border-radius:12px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div id="desktopGate">
<div class="gate-box">
<div class="gate-icon">🖥️</div>
<h1>يجب تفعيل وضع سطح المكتب</h1>
<p>هذه المنصة تعمل بوضع سطح المكتب. فعّل وضع سطح المكتب مرة واحدة ثم أعد تحميل الصفحة.</p>
<div class="steps">
<b>في Google Chrome:</b><br>
1. اضغط على ⋮ أعلى المتصفح.<br>
2. فعّل <b>موقع سطح المكتب</b>.<br>
3. اضغط على زر إعادة التحميل.
</div>
<button class="reload" onclick="location.reload()">إعادة تحميل الصفحة</button>
</div>
</div>
<div id="app">
<!-- محتوى موقعك الحالي يوضع هنا -->
</div>
<script>
(function(){
const APPROVAL_KEY='desktop_approved_v1';
const gate=document.getElementById('desktopGate');
const app=document.getElementById('app');
function isDesktop(){
const ua=navigator.userAgent.toLowerCase();
const mobile=/android|iphone|ipad|ipod|mobile|tablet/i.test(ua);
const desktop=/windows nt|macintosh|linux x86_64|cros/i.test(ua);
const width=window.innerWidth;
const touch=navigator.maxTouchPoints||0;
return !mobile||desktop||(width>=900&&touch===0);
}
function checkDesktop(){
if(localStorage.getItem(APPROVAL_KEY)==='1'){
app.style.display='';
gate.style.display='none';
return;
}
if(isDesktop()){
localStorage.setItem(APPROVAL_KEY,'1');
app.style.display='';
gate.style.display='none';
}else{
app.style.display='none';
gate.style.display='flex';
}
}
checkDesktop();
if('serviceWorker'in navigator){
window.addEventListener('load',function(){
navigator.serviceWorker.register('/my-website/sw.js',{scope:'/my-website/'}).catch(function(){});
});
}
})();
</script>
<script src="/my-website/js/main.js"></script>
</body>
</html>
