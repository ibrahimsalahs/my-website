<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>يتطلب وضع سطح المكتب</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Tahoma,sans-serif;background:#f5f8fc;color:#10284c;min-height:100vh}.gate{min-height:100vh;display:none;align-items:center;justify-content:center;padding:25px}.card{width:100%;max-width:520px;background:#fff;border-radius:25px;padding:35px;text-align:center;box-shadow:0 15px 45px #10284c18}.icon{font-size:70px;margin-bottom:20px}.card h1{font-size:28px;margin-bottom:15px}.card p{font-size:17px;line-height:1.8;color:#60718d;margin-bottom:25px}.steps{text-align:right;background:#f5f8fc;border-radius:18px;padding:20px;line-height:2;font-size:16px}.site{display:none}.open{display:flex}
</style>
</head>
<body>
<div class="gate" id="gate">
<div class="card">
<div class="icon">🖥️</div>
<h1>يجب تفعيل وضع سطح المكتب</h1>
<p>هذا الموقع مصمم للعمل بوضع سطح المكتب. قم بتفعيل وضع سطح المكتب من إعدادات المتصفح ثم أعد تحميل الصفحة.</p>
<div class="steps">
<b>في Google Chrome:</b><br>
1. اضغط على ⋮ أعلى المتصفح.<br>
2. فعّل <b>موقع سطح المكتب</b>.<br>
3. أعد تحميل الصفحة.
</div>
</div>
</div>
<div class="site" id="site">
<!-- ضع موقعك هنا -->
<h1>موقعك يعمل الآن بوضع سطح المكتب</h1>
</div>
<script>
(function(){
const ua=navigator.userAgent.toLowerCase();
const mobile=/android|iphone|ipad|ipod|mobile|tablet/i.test(ua);
const desktopSite=/windows nt|macintosh|linux x86_64|cros/i.test(ua);
const width=window.innerWidth;
const isDesktop=!mobile||desktopSite||(width>=900&&!('ontouchstart'in window&&navigator.maxTouchPoints>0));
document.getElementById(isDesktop?'site':'gate').classList.add('open');
})();
</script>
</body>
</html>
