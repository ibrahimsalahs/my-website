<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>أكاديمية البيان</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Tahoma,sans-serif;background:#f0f2f5;color:#1c1e21}
body{display:flex;justify-content:center}
.app{width:100%;max-width:850px;height:100vh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 20px #0001}
.header{height:62px;background:#0866ff;color:#fff;display:flex;align-items:center;padding:0 18px;gap:12px;flex-shrink:0}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:#0866ff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold}
.headtext{flex:1}.headtext b{display:block;font-size:17px}.headtext span{font-size:12px;opacity:.9}
.online{width:9px;height:9px;background:#31d158;border-radius:50%}
.login{position:absolute;z-index:5;inset:0;background:#f0f2f5;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:28px 22px;box-shadow:0 5px 25px #0002;text-align:center}
.loginlogo{width:70px;height:70px;margin:auto auto 15px;border-radius:50%;background:#0866ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold}
.loginbox h2{margin:5px 0 8px;font-size:23px}.loginbox p{margin:0 0 20px;color:#65676b;font-size:14px}
.input{width:100%;height:48px;border:1px solid #ccd0d5;border-radius:12px;padding:0 15px;text-align:center;font-size:16px;outline:0}
.input:focus{border-color:#0866ff;box-shadow:0 0 0 2px #0866ff22}
.start{width:100%;height:48px;border:0;border-radius:12px;background:#0866ff;color:#fff;font-size:16px;font-weight:bold;margin-top:12px;cursor:pointer}
.start:active{transform:scale(.99)}
.chat{flex:1;overflow-y:auto;padding:18px 14px 10px;background:#fff;scroll-behavior:smooth}
.welcome{text-align:center;color:#65676b;font-size:13px;margin:5px auto 20px}
.bubble{max-width:80%;background:#e4e6eb;border-radius:18px 18px 18px 5px;padding:11px 14px;margin:7px 0;text-align:right;line-height:1.7;font-size:15px;white-space:pre-wrap}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.card{border:1px solid #e1e4e8;background:#fff;border-radius:15px;padding:14px;text-align:right;cursor:pointer;box-shadow:0 2px 7px #0000000b;transition:.15s}
.card:hover{background:#f5f7fa;transform:translateY(-1px)}
.card:active{transform:scale(.98)}
.icon{font-size:23px;margin-bottom:7px}.card b{display:block;font-size:15px}.card span{display:block;color:#65676b;font-size:12px;margin-top:4px;line-height:1.5}
.bottom{min-height:60px;border-top:1px solid #ddd;background:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.bottom input{flex:1;height:43px;border:1px solid #ccd0d5;border-radius:22px;padding:0 16px;outline:0;font-size:14px}
.bottom button{width:43px;height:43px;border:0;border-radius:50%;background:#0866ff;color:#fff;font-size:18px;cursor:pointer}
.loading{text-align:center;color:#65676b;font-size:13px;padding:10px}.error{background:#ffe5e8;color:#b4232d;border-radius:12px;padding:11px;margin:10px 0;font-size:13px}
.back{width:100%;border:0;background:#f0f2f5;border-radius:12px;padding:11px;font-size:14px;cursor:pointer;margin-top:5px}
@media(max-width:520px){.menu{grid-template-columns:1fr}.bubble{max-width:88%}.chat{padding:15px 10px 8px}.header{padding:0 12px}}
@media(min-width:700px){.chat{padding-left:30px;padding-right:30px}.menu{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>

<div id="login" class="login">
<div class="loginbox">
<div class="loginlogo">ب</div>
<h2>أكاديمية البيان</h2>
<p>سجّل الدخول باستخدام ID الطالب</p>
<input id="studentId" class="input" type="text" inputmode="numeric" placeholder="أدخل ID الطالب" autocomplete="off">
<button class="start" onclick="start()">ابدأ</button>
</div>
</div>

<div class="app">
<div class="header">
<div class="logo">ب</div>
<div class="headtext"><b>أكاديمية البيان</b><span>المساعد الطلابي</span></div>
<div class="online"></div>
</div>

<div id="chat" class="chat">
<div class="welcome">أهلًا بك في أكاديمية البيان 👋</div>
</div>

<div class="bottom">
<input id="message" placeholder="اختر من القائمة..." disabled>
<button onclick="sendMainMenu()">⌂</button>
</div>
</div>

<script>
const CONFIG={
 API_URL:'https://script.google.com/macros/s/AKfycbw9utjlPZyqeNic1edJmm-e0L86nlnDV1jNF8-37DqxFwt-j8uAyoqNN1BiGRaNeNC3/exec',
 SECRET:'CHANGE_THIS_SECRET'
};

let senderId='';
let cbNo=0;

function start(){
 const id=document.getElementById('studentId').value.trim();
 if(!id)return alert('من فضلك أدخل ID الطالب');
 senderId=id;
 document.getElementById('login').style.display='none';
 document.getElementById('chat').innerHTML='<div class="welcome">تم تسجيل الدخول بالـ ID: '+esc(id)+'</div>';
 send('MAIN_MENU');
}

function send(payload){
 if(!senderId)return;
 const chat=document.getElementById('chat');
 chat.innerHTML+='<div class="loading" id="loading">جاري التحميل...</div>';
 chat.scrollTop=chat.scrollHeight;

 const cb='cb'+(++cbNo);
 window[cb]=function(data){
  delete window[cb];
  if(script)script.remove();
  const load=document.getElementById('loading');
  if(load)load.remove();

  if(!data||!data.ok){
   addError(data&&data.error?data.error:'حدث خطأ في الخادم');
   return;
  }

  render(data.result);
 };

 const script=document.createElement('script');
 script.src=CONFIG.API_URL+
 '?secret='+encodeURIComponent(CONFIG.SECRET)+
 '&senderId='+encodeURIComponent(senderId)+
 '&payload='+encodeURIComponent(payload)+
 '&callback='+cb+
 '&_='+Date.now();

 script.onerror=function(){
  delete window[cb];
  script.remove();
  const load=document.getElementById('loading');
  if(load)load.remove();
  addError('تعذر الاتصال بالخادم');
 };

 document.body.appendChild(script);
}

function render(data){
 if(!data)return;

 if(data.type==='menu'){
  renderMenu(data.elements||[]);
  return;
 }

 if(data.type==='message'){
  addBubble(data.text||'');
  return;
 }

 if(data.text){
  addBubble(data.text);
  return;
 }

 if(data.message){
  addBubble(data.message);
  return;
 }

 if(data.buttons){
  renderButtons(data.buttons);
 }
}

function renderMenu(items){
 const chat=document.getElementById('chat');
 const box=document.createElement('div');
 box.className='menu';

 items.forEach(item=>{
  const b=document.createElement('button');
  b.className='card';
  b.innerHTML=
   '<div class="icon">'+getIcon(item.title)+'</div>'+
   '<b>'+esc(item.title||'')+'</b>'+
   '<span>'+esc(item.subtitle||'')+'</span>';

  if(item.payload)b.onclick=()=>send(item.payload);
  box.appendChild(b);
 });

 chat.appendChild(box);
 chat.scrollTop=chat.scrollHeight;
}

function renderButtons(items){
 const chat=document.getElementById('chat');
 const box=document.createElement('div');
 box.className='menu';

 items.forEach(item=>{
  const b=document.createElement('button');
  b.className='card';
  b.innerHTML='<b>'+esc(item.title||'فتح')+'</b>';
  b.onclick=()=>send(item.payload);
  box.appendChild(b);
 });

 chat.appendChild(box);
 chat.scrollTop=chat.scrollHeight;
}

function addBubble(text){
 const chat=document.getElementById('chat');
 const div=document.createElement('div');
 div.className='bubble';
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function addError(text){
 const chat=document.getElementById('chat');
 const div=document.createElement('div');
 div.className='error';
 div.textContent=text;
 chat.appendChild(div);
}

function sendMainMenu(){
 if(senderId)send('MAIN_MENU');
}

function getIcon(title){
 if(title.includes('حساب'))return '👤';
 if(title.includes('واجب'))return '📝';
 if(title.includes('اختبار'))return '📚';
 if(title.includes('تقييم'))return '⭐';
 if(title.includes('نتيجة'))return '🏆';
 if(title.includes('ميتنج'))return '🎥';
 if(title.includes('اشتراك'))return '📅';
 if(title.includes('فاتورة'))return '💰';
 return '📌';
}

function esc(v){
 return String(v).replace(/[&<>"']/g,m=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#039;'
 })[m]);
}

document.getElementById('studentId').addEventListener('keydown',e=>{
 if(e.key==='Enter')start();
});
</script>

</body>
</html>
