<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة أكاديمية البيان التعليمية</title>
  
  <!-- ربط المانيفست بالمسار الصحيح للـ GitHub Pages -->
  <link rel="manifest" href="/my-website/manifest.json">
  
  <meta name="theme-color" content="#000000">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background-color: #f9f9f9;
    }
    h1 {
      color: #333;
    }
    #installBtn {
      display: none;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #installBtn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>مرحباً بك في تطبيقي!</h1>
  <p>منصة أكاديمية البيان التعليمية</p>

  <button id="installBtn">ثبّت التطبيق الآن</button>

  <script>
    // تسجيل الـ Service Worker مع تحديد النطاق (Scope) الصحيح للمجلد
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/my-website/sw.js', { scope: '/my-website/' })
          .then(reg => console.log('تم تسجيل Service Worker بنجاح!', reg))
          .catch(err => console.log('فشل تسجيل Service Worker:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('وافق المستخدم على التثبيت');
          }
          deferredPrompt = null;
          installBtn.style.display = 'none';
        });
      }
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
