<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>اختبار أكاديمية البيان</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3f6fa;
  color:#182230;
  font-family:Tahoma,Arial,sans-serif;
}
.container{
  width:min(760px,94%);
  margin:20px auto 50px;
}
.header{
  background:#fff;
  border-radius:24px;
  padding:24px 20px;
  margin-bottom:18px;
  box-shadow:0 5px 22px rgba(0,0,0,.06);
}
.logo{
  font-size:28px;
  font-weight:800;
  text-align:center;
  margin-bottom:8px;
}
.exam-info{
  text-align:center;
  color:#667085;
  line-height:1.9;
  font-size:15px;
}
.section{
  background:#fff;
  border-radius:24px;
  padding:18px;
  margin:18px 0;
  box-shadow:0 5px 22px rgba(0,0,0,.05);
}
.section-title{
  font-size:22px;
  font-weight:800;
  margin:2px 4px 18px;
}
.question{
  border:1px solid #e5e9ef;
  border-radius:20px;
  padding:18px;
  margin:14px 0;
  background:#fbfcfe;
}
.question-title{
  font-size:18px;
  font-weight:700;
  line-height:1.8;
  margin-bottom:14px;
}
.option{
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  border:1px solid #e1e6ed;
  border-radius:14px;
  padding:13px;
  margin:9px 0;
  cursor:pointer;
  transition:.15s;
}
.option:has(input:checked){
  border-color:#2563eb;
  background:#eff6ff;
}
.option input{
  width:19px;
  height:19px;
  flex:none;
}
.answer-input{
  width:100%;
  min-height:110px;
  resize:vertical;
  border:1px solid #d8dee8;
  border-radius:16px;
  padding:15px;
  font:inherit;
  font-size:16px;
  outline:none;
  background:#fff;
}
.answer-input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.10);
}
.extract-passage{
  background:#f8fafc;
  border-right:4px solid #2563eb;
  border-radius:12px;
  padding:15px;
  line-height:2;
  margin-bottom:16px;
}
.btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  font:inherit;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}
.submit{
  background:#2563eb;
  color:#fff;
  margin-top:10px;
}
.submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.status{
  display:none;
  text-align:center;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
  font-weight:700;
}
.loading{
  background:#fff;
  border-radius:20px;
  padding:35px;
  text-align:center;
  box-shadow:0 5px 22px rgba(0,0,0,.05);
}
.error{color:#b42318;background:#fef3f2}
.success{color:#027a48;background:#ecfdf3}
.empty{text-align:center;color:#667085;padding:30px}
.badge{
  display:inline-block;
  background:#eef4ff;
  color:#175cd3;
  padding:5px 10px;
  border-radius:30px;
  font-size:13px;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div class="container">

  <div id="loading" class="loading">جاري تحميل الاختبار...</div>

  <div id="app" style="display:none">
    <div class="header">
      <div class="logo">أكاديمية البيان</div>
      <div id="studentInfo" class="exam-info"></div>
    </div>

    <form id="examForm"></form>

    <button id="submitBtn" class="btn submit" type="button">
      إرسال الاختبار
    </button>

    <div id="status" class="status"></div>
  </div>

</div>

<script src="exam-fetch.js"></script>
<script src="exam-submit.js"></script>
</body>
</html>
